<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --laranja: #F47820;
      --laranja-escuro: #D86512;
      --laranja-texto: #7A3507;
      --laranja-claro: #FDE9D9;
      --preto: #231F20;
      --grafite: #4A4546;
      --borda: #DEDAD8;
      --suave: #706B6C;
      --verde: #1E7145;
      --vermelho: #A52422;
      --fundo: #F5F4F3;
      --papel: #FFFFFF;
      --texto: #231F20;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fundo); color: var(--texto);
      font-family: Roboto, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px;
    }
    header {
      background: var(--preto); color: #fff; padding: 10px 14px;
      border-bottom: 3px solid var(--laranja);
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 12px;
    }
    header .marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
    header .logo {
      width: 32px; height: 32px; border-radius: 8px; background: var(--laranja);
      display: grid; place-items: center; font-size: 16px; flex: 0 0 auto;
    }
    header h1 {
      margin: 0; font-size: 14.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    header .meta { font-size: 11px; opacity: .82; white-space: nowrap; }
    .espaco { flex: 1; }
    #btnMenu {
      display: none; background: none; border: 1px solid rgba(255,255,255,.35);
      color: #fff; border-radius: 7px; padding: 6px 10px; font-size: 15px; cursor: pointer;
    }
    .busca-caixa { position: relative; flex: 0 1 280px; }
    #buscaMenu {
      width: 100%; padding: 7px 10px 7px 30px; border-radius: 7px; font-size: 13px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #fff;
    }
    #buscaMenu::placeholder { color: rgba(255,255,255,.6); }
    #buscaMenu:focus {
      outline: none; background: #fff; color: var(--texto);
      border-color: #fff; box-shadow: none;
    }
    #buscaMenu:focus::placeholder { color: #9aa2ae; }
    .busca-caixa .lupa {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      font-size: 12px; opacity: .7; pointer-events: none;
    }
    .cta {
      background: var(--laranja); color: var(--preto); border: none; border-radius: 7px;
      padding: 8px 13px; font-weight: 700; font-size: 13px; cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }
    .cta:hover { background: var(--laranja-escuro); }

    .app { display: grid; grid-template-columns: 224px 1fr; min-height: calc(100vh - 54px); }
    nav {
      background: var(--papel); border-right: 1px solid var(--borda);
      padding: 10px 8px 24px; overflow-y: auto;
    }
    nav .grupo { margin-bottom: 4px; }
    nav .titulo-grupo {
      display: flex; align-items: center; gap: 6px; width: 100%; background: none;
      border: none; cursor: pointer; font-family: inherit; padding: 8px 10px;
      font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--suave); font-weight: 700;
    }
    nav .titulo-grupo:hover { color: var(--laranja-texto); }
    nav .titulo-grupo .seta { transition: transform .15s; font-size: 9px; }
    nav .grupo.fechado .seta { transform: rotate(-90deg); }
    nav .grupo.fechado .itens { display: none; }
    nav .item {
      display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      background: none; border: none; padding: 9px 11px; border-radius: 7px;
      cursor: pointer; font-family: inherit; font-size: 13.5px; color: #333;
      margin-bottom: 1px; position: relative;
    }
    nav .item:hover { background: #FFF4EC; }
    nav .item.ativo { background: var(--laranja); color: var(--preto); font-weight: 700; }
    nav .item.ativo .icone { filter: none; }
    nav .item .icone { width: 18px; text-align: center; flex: 0 0 auto; }
    nav .item .selo {
      margin-left: auto; background: var(--vermelho); color: #fff; font-size: 10px;
      font-weight: 700; border-radius: 10px; padding: 1px 7px;
    }
    nav .item.ativo .selo { background: rgba(255,255,255,.25); }
    nav .vazio { padding: 14px 12px; color: var(--suave); font-size: 12px; }
    #veu {
      display: none; position: fixed; inset: 54px 0 0; background: rgba(16,20,28,.4); z-index: 25;
    }
    #veu.aberto { display: block; }
    main { padding: 16px; overflow-x: hidden; }
    h2.titulo { margin: 0 0 4px; font-size: 17px; color: var(--preto); border-left: 4px solid var(--laranja); padding-left: 8px; }
    p.sub { margin: 0 0 14px; color: var(--suave); font-size: 12.5px; }
    .cartao {
      background: var(--papel); border: 1px solid var(--borda); border-radius: 9px;
      padding: 14px; margin-bottom: 14px;
    }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--papel); border: 1px solid var(--borda); border-radius: 9px; padding: 11px 13px; }
    .kpi .rotulo { font-size: 10px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .3px; }
    .kpi .valor { font-size: 18px; font-weight: 700; color: var(--preto); margin-top: 4px; }
    .kpi .valor.sobe { color: var(--vermelho); }
    .kpi .valor.desce { color: var(--verde); }
    label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 12.5px; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 7px;
      font-size: 15px; font-family: inherit; background: #fff; color: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--laranja); box-shadow: 0 0 0 3px rgba(244,120,32,.14);
    }
    input:disabled { background: #f3f4f6; color: #9ca3af; }
    .linha { display: flex; gap: 10px; flex-wrap: wrap; }
    .linha > div { flex: 1 1 150px; }
    button.acao {
      padding: 11px 16px; border: none; border-radius: 7px; background: var(--laranja);
      color: var(--preto); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    button.acao.secundaria { background: #fff; color: var(--preto); border: 1px solid #B8B1AE; }
    button.acao.perigo { background: var(--vermelho); color: #fff; }
    button.acao:disabled { opacity: .5; cursor: default; }
    .barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
    .barra > div { flex: 1 1 190px; }
    .rolagem { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
    th {
      background: var(--preto); color: #fff; font-size: 10.5px; text-transform: uppercase;

    }

    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 700; background: var(--laranja-claro); border-top: 2px solid var(--laranja); }
    .contagem { font-size: 11.5px; color: var(--suave); margin-top: 8px; }
    .aviso { background: #fff4e5; border: 1px solid #f0c890; color: #7a4f00; border-radius: 7px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    .erro-caixa { background: #fce4e4; border: 1px solid #e6b3b3; color: var(--vermelho); border-radius: 7px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    .ok-caixa { background: #e2efda; border: 1px solid #b7d7a8; color: var(--verde); border-radius: 7px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    .carregando { text-align: center; color: var(--suave); padding: 34px 0; }

    #status {

<script>
  var CONFIG = null;      // período, placas, tipos
  var OPCOES = null;      // centros e categorias
  var TELA = '<?= paginaInicial ?>';
  var TOKEN = '';
  var SESSAO = null;
  var INICIO_CLIENTE = null;
  var PENDENCIAS_CLIENTE = null;
  var FILTRO_PEND_VEICULO = 'TODOS';
  var FILTRO_PEND_TIPO = 'TODOS';
  // Começa escondendo as resolvidas: elas saem da contagem mas não saíam da
  // lista, e a tela parecia nunca esvaziar.
  var FILTRO_PEND_SITUACAO = 'ABERTAS';

  // ------------------------------------------------------------ utilidades
  function el(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function brl(n, casas) {
    return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', {
      minimumFractionDigits: casas === undefined ? 2 : casas,
      maximumFractionDigits: casas === undefined ? 2 : casas
    });
  }
  function num(n, casas) {
    return Number(n || 0).toLocaleString('pt-BR', {
      minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0
    });
  }
  function dataBR(iso) {
    var p = String(iso).split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function formatar(valor, tipo) {
    if (valor === null || valor === undefined || valor === '') return '';
    switch (tipo) {
      case 'moeda': return brl(valor);
      case 'moeda3': return brl(valor, 3);
      case 'numero': return num(valor);
      case 'decimal': return num(valor, 2);
      default: return esc(valor);
    }
  }
  function numerico(tipo) {
    return ['moeda', 'moeda3', 'numero', 'decimal'].indexOf(tipo) !== -1;
  }
  function status(texto, erro) {
    var barra = el('status');
    barra.textContent = texto;
    barra.className = erro ? 'erro' : '';
    barra.style.display = 'block';
    if (!erro) setTimeout(function () { barra.style.display = 'none'; }, 7000);
  }
  function statusHtml(html) {
    var barra = el('status');
    barra.innerHTML = html;
    barra.className = '';
    barra.style.display = 'block';
  }
  function carregando(mensagem) {
    el('tela').innerHTML = '<div class="carregando">' + esc(mensagem || 'carregando…') + '</div>';
  }
  function falha(erro) {
    el('tela').innerHTML = '<div class="erro-caixa">' + esc(erro.message) + '</div>';

  /** Monta uma tabela a partir do formato devolvido pela API. */
  /**
   * opcoes.html libera HTML na celula. E opt-in de proposito: por padrao tudo
   * passa por esc(), e so a lista de veiculos — cujo conteudo o proprio app monta
   * — pede o botao de editar.
   */
  function col(titulo, tipo) { return { titulo: titulo, tipo: tipo || 'texto' }; }

  function tabela(dados, vazio, opcoes) {
    var permitirHtml = !!(opcoes && opcoes.html);
    // Linha de bloco: primeira celula preenchida e a segunda vazia. E como o
    // relatorio de manutencao separa "cabecalho do veiculo" das linhas de servico
    // sem precisar de um formato de dados diferente.
    var destacarBloco = !!(opcoes && opcoes.destacarBloco);
    if (!dados || !dados.linhas || !dados.linhas.length) {
      return '<div class="cartao">' + esc(vazio || 'Nada para mostrar.') + '</div>';
    }
    var cabecalho = dados.colunas.map(function (c) {
      return '<th class="' + (numerico(c.tipo) ? 'num' : '') + '">' + esc(c.titulo) + '</th>';
    }).join('');

    var corpo = dados.linhas.map(function (linha) {
      var ehBloco = destacarBloco && linha.length > 1 &&
        String(linha[0] || '') !== '' && String(linha[1] || '') === '';
      return '<tr' + (ehBloco ? ' style="background:#FFF4EC;font-weight:800"' : '') + '>' +
        linha.map(function (valor, i) {
        var tipo = dados.colunas[i] ? dados.colunas[i].tipo : 'texto';
        var ehBotao = permitirHtml && i === linha.length - 1 &&
          typeof valor === 'string' && valor.indexOf('<button') === 0;
        return '<td class="' + (numerico(tipo) ? 'num' : '') + '">' +
          (ehBotao ? valor : formatar(valor, tipo)) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    var rodape = '';
    if (dados.totais && dados.totais.length) {
      rodape = '<tfoot><tr>' + dados.colunas.map(function (c, i) {
        var valor = dados.totais[i];
        var texto = i === 0 && (valor === null || valor === undefined)
          ? 'TOTAL' : formatar(valor, c.tipo);
        return '<td class="' + (numerico(c.tipo) ? 'num' : '') + '">' + texto + '</td>';
      }).join('') + '</tr></tfoot>';
    }

    return '<div class="cartao" style="padding:0;overflow:hidden">' +
      '<div class="rolagem"><table><thead><tr>' + cabecalho + '</tr></thead>' +
      '<tbody>' + corpo + '</tbody>' + rodape + '</table></div></div>' +
      '<div class="contagem">' + dados.linhas.length + ' linha(s)' +
      (dados.mensagem ? ' • ' + esc(dados.mensagem) : '') + '</div>';
  }

    el('cbPreco').textContent = (q > 0 && v > 0)
      ? 'Preço da carga: R$ ' + (v / q).toFixed(4).replace('.', ',') + ' por litro.'
      : '';
  }

  function carregarCargas() {

        '<th>Data</th><th>NF</th><th>Produto</th><th class="num">Litros</th><th class="num">Valor</th><th class="num">R$/L</th><th>Obs.</th><th></th>' +

  function salvarCorrecaoCarga() {
    var c = window.CARGA_SEL; if (!c) return;
    el('btnEc').disabled = true;
    el('msgEc').innerHTML = '<div class="sub2">salvando e recalculando…</div>';
    google.script.run.withSuccessHandler(function (r) {
      el('btnEc').disabled = false;
      el('msgEc').innerHTML = '<div class="' + (r.ok ? 'ok-caixa' : 'erro-caixa') + '">' + esc(r.mensagem) + '</div>';
      if (r.ok) { status('Carga corrigida.'); carregarTanques(); carregarCargas(); }
    }).withFailureHandler(function (e) {
      el('btnEc').disabled = false; el('msgEc').innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';
    }).webEditarCargaBomba(TOKEN, c.linha, c, {
      data: el('ecData').value, produto: el('ecProduto').value, quantidade: el('ecQtd').value,
      valor: el('ecValor').value, documento: el('ecDoc').value

  function confirmarExclusaoCarga() {

  function gravarCarga(confirmarDuplicidade) {
    var botao = el('btnCarga');

    google.script.run
      .withSuccessHandler(function (r) {
        botao.disabled = false;
        botao.textContent = 'Registrar carga';
        if (!r.ok && r.duplicidade && confirmarDuplicidade !== true) {
          if (confirm(r.mensagem + '\n\nRegistrar mesmo assim?')) { gravarCarga(true); return; }
        }
        el('msgCarga').innerHTML = '<div class="' + (r.ok ? 'ok-caixa' : 'erro-caixa') + '">' +
          esc(r.mensagem) + '</div>';
        if (r.ok) {
          ['cbQuantidade', 'cbValor', 'cbDocumento', 'cbObs'].forEach(function (id) { el(id).value = ''; });
          previaPrecoLitro();
          carregarTanques();
          carregarCargas();

      })
      .withFailureHandler(function (e) {
        botao.disabled = false;
        botao.textContent = 'Registrar carga';
        el('msgCarga').innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';

      .webSalvarCargaBomba(TOKEN, {
        data: el('cbData').value, produto: el('cbProduto').value,
        quantidade: el('cbQuantidade').value, valor: el('cbValor').value,

        observacao: el('cbObs').value, confirmarDuplicidade: confirmarDuplicidade === true

  function sugerirIpva() {
    var placa = el('ipPlaca').value;
    var v = (CONFIG.veiculos || []).filter(function (x) { return x.placa === placa; })[0];
    if (v && Number(v.ipva) > 0 && !el('ipValor').value) el('ipValor').value = Number(v.ipva).toFixed(2);
    previaIpva();
  }

  /** Mostra as parcelas ANTES de gravar, inclusive a última com a sobra do centavo. */
  function previaIpva() {
    var total = Math.round(Number(el('ipValor').value || 0) * 100);
    if (!(total > 0)) { el('ipPrevia').textContent = ''; return; }
    var base = Math.floor(total / 12);
    var ultima = total - base * 11;
    el('ipPrevia').textContent = base === ultima
      ? '12 parcelas de ' + brl(base / 100) + '.'
      : '11 parcelas de ' + brl(base / 100) + ' e a última de ' + brl(ultima / 100) +
        ', para fechar o centavo.';
  }

  function carregarSituacaoIpva() {

  function gruposFechados() {
    try { return JSON.parse(sessionStorage.getItem('gruposFechados') || '[]'); }
    catch (e) { return []; }
  }
  function guardarGrupos(lista) {
    try { sessionStorage.setItem('gruposFechados', JSON.stringify(lista)); } catch (e) {}
  }

  function montarMenu(filtro) {
    var termo = String(filtro || '').toLowerCase().trim();
    var fechados = gruposFechados();
    var achou = 0;

    var html = MENU.map(function (grupo) {
      var itens = grupo.itens.filter(function (item) {
        if (SESSAO && SESSAO.telas && SESSAO.telas.indexOf(item.id) === -1) return false;
        if (!termo) return true;
        return (item.rotulo + ' ' + item.busca).toLowerCase().indexOf(termo) !== -1;
      });
      if (!itens.length) return '';
      achou += itens.length;

      // durante a busca todos os grupos aparecem abertos
      var fechado = !termo && fechados.indexOf(grupo.grupo) !== -1;
      return '<div class="grupo' + (fechado ? ' fechado' : '') +
        '" data-grupo="' + esc(grupo.grupo) + '">' +
        '<button class="titulo-grupo" onclick="alternarGrupo(\'' + esc(grupo.grupo) + '\')">' +
          '<span class="seta">▼</span>' + esc(grupo.grupo) + '</button>' +
        '<div class="itens">' + itens.map(function (item) {
          return '<button class="item" data-tela="' + item.id +
            '" onclick="abrir(\'' + item.id + '\')">' +
            '<span class="icone">' + item.icone + '</span>' + esc(item.rotulo) +
            (item.selo ? '<span class="selo">' + item.selo + '</span>' : '') +
            '</button>';
        }).join('') + '</div></div>';
    }).join('');

    el('nav').innerHTML = achou ? html
      : '<div class="vazio">Nada encontrado para “' + esc(termo) + '”.</div>';

  function marcarAtivo() {

  function alternarGrupo(nome) {
    var fechados = gruposFechados();
    var i = fechados.indexOf(nome);
    if (i === -1) fechados.push(nome); else fechados.splice(i, 1);
    guardarGrupos(fechados);
    montarMenu(el('buscaMenu') ? el('buscaMenu').value : '');

    var item = telaPorId(id);

    if (!SESSAO || !SESSAO.telas || SESSAO.telas.indexOf(id) === -1) { status('Seu perfil não possui acesso a esta tela.', true); return; }
    TELA = id;
    marcarAtivo();
    fecharMenuNoCelular();
    item.fn();

  document.addEventListener('input', function (evento) {

  document.addEventListener('keydown', function (evento) {
    var busca = el('buscaMenu');
    if (!busca) return;

    // "/" em qualquer lugar foca a busca (menos enquanto se digita num campo)
    var digitando = ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(
      document.activeElement.tagName) !== -1;
    if (evento.key === '/' && !digitando) {
      evento.preventDefault();
      busca.focus();
      busca.select();
      return;
    }
    if (document.activeElement !== busca) return;

    if (evento.key === 'Enter') {
      var primeiro = el('nav').querySelector('.item');
      if (primeiro) {
        abrir(primeiro.getAttribute('data-tela'));
        busca.blur();
      }
    }
    if (evento.key === 'Escape') {
      busca.value = '';
      montarMenu('');
      busca.blur();
    }
  });

  function confirmarTrocaObrigatoria() {
    var atual = el('trocaAtual').value;
    var nova = el('trocaNova').value;
    var confirmar = el('trocaConfirmar').value;
    var msg = el('trocaSenhaMsg');
    if (!atual || !nova || !confirmar) {
      msg.innerHTML = '<div class="erro-caixa">Preencha os três campos.</div>'; return;
    }
    if (nova.length < 10) {
      msg.innerHTML = '<div class="erro-caixa">A nova senha precisa ter pelo menos 10 caracteres.</div>'; return;
    }
    if (nova !== confirmar) {
      msg.innerHTML = '<div class="erro-caixa">A confirmação não corresponde à nova senha.</div>'; return;
    }
    if (nova === atual) {
      msg.innerHTML = '<div class="erro-caixa">A nova senha precisa ser diferente da senha temporária/atual.</div>'; return;
    }
    var botao = el('btnTrocarSenha');
    botao.disabled = true; botao.textContent = 'Salvando…';
    google.script.run
      .withSuccessHandler(function(r){
        botao.disabled = false; botao.textContent = 'Salvar nova senha';

        SESSAO = r.usuario || SESSAO;
        msg.innerHTML = '<div class="ok-caixa">' + esc(r.mensagem) + '</div>';

  function aplicarBootstrapCliente(pacote, inicial) {
    if (!pacote || !pacote.ok) {
      mostrarLogin(pacote && pacote.mensagem ? pacote.mensagem : 'Não foi possível carregar o sistema.');
      return false;
    }
    SESSAO = pacote.usuario || SESSAO;
    if (pacote.trocarSenha === true || (SESSAO && SESSAO.trocarSenha === true)) {
      mostrarTrocaSenha(); return false;
    }

    CONFIG = pacote.config;
    OPCOES = pacote.filtros || { centros:[], categorias:[] };
    INICIO_CLIENTE = pacote.inicio || null;
    if (!CONFIG) { mostrarLogin('Configuração do sistema indisponível.'); return false; }

    el('loginTela').style.display = 'none';
    el('trocaSenhaTela').style.display = 'none';
    el('cabecalhoApp').style.display = 'flex';
    el('corpoApp').style.display = 'grid';
    el('meta').textContent = dataBR(CONFIG.inicio) + ' a ' + dataBR(CONFIG.fim) + '  •  ' + CONFIG.mes;
    el('usuarioTopo').innerHTML = '<span>' + esc(SESSAO.nome || SESSAO.email) + ' • ' + esc(SESSAO.perfil) + '</span>' +
      '<button onclick="sair()">Sair</button>';

    montarMenu();

  function mesCurto(chave) {
    var p = String(chave || '').split('-');
    if (p.length !== 2) return String(chave || '');
    var nomes = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
    return nomes[Math.max(0, Number(p[1]) - 1)] + '/' + String(p[0]).slice(-2);
  }

  function graficoEvolucao(d) {
    var serie = (d.evolucao || []).slice(-11);
    if (!serie.length || String(serie[serie.length - 1].periodo) !== String(d.mes)) {
      serie.push({ periodo:d.mes, total:Number(d.total || 0), atual:true });
    }
    if (!serie.length) return '<div class="sub2">Sem histórico para exibir.</div>';
    var W=680,H=225,L=52,R=18,T=18,B=38;
    var vals=serie.map(function(x){return Number(x.total||0);});
    var max=Math.max.apply(null,vals.concat([1]));
    var min=0;
    var dx=serie.length>1?(W-L-R)/(serie.length-1):0;
    function y(v){return T+(H-T-B)*(1-(v-min)/(max-min||1));}
    var pts=serie.map(function(x,i){return (L+i*dx).toFixed(1)+','+y(vals[i]).toFixed(1);}).join(' ');
    var area='M '+L+' '+(H-B)+' L '+pts.split(' ').join(' L ')+' L '+(L+(serie.length-1)*dx)+' '+(H-B)+' Z';
    var grids='';
    for(var g=0;g<=4;g++){
      var gy=T+(H-T-B)*g/4; var gv=max*(1-g/4);
      grids+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#EEEAE8" stroke-width="1"/>'+
        '<text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#9B9694">'+
        (gv>=1000000?(gv/1000000).toFixed(1)+'M':gv>=1000?(gv/1000).toFixed(0)+'k':gv.toFixed(0))+'</text>';
    }
    var labels='',circulos='';
    serie.forEach(function(x,i){
      var px=L+i*dx, py=y(vals[i]);
      var mostrar=serie.length<=7 || i%2===0 || i===serie.length-1;
      if(mostrar) labels+='<text x="'+px+'" y="'+(H-13)+'" text-anchor="middle" font-size="9" fill="#706B6C">'+esc(mesCurto(x.periodo))+'</text>';
      circulos+='<circle cx="'+px+'" cy="'+py+'" r="'+(i===serie.length-1?4.5:3)+'" fill="'+(i===serie.length-1?'#F47820':'#9B9694')+'"><title>'+esc(mesCurto(x.periodo))+' • '+esc(brl(vals[i]))+'</title></circle>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução mensal dos custos">'+
      '<defs><linearGradient id="areaDash" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F47820" stop-opacity=".24"/><stop offset="100%" stop-color="#F47820" stop-opacity=".02"/></linearGradient></defs>'+
      grids+'<path d="'+area+'" fill="url(#areaDash)"/><polyline points="'+pts+'" fill="none" stroke="#F47820" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+circulos+labels+'</svg>';
  }

  function graficoDonut(d) {
    var itens=(d.composicao||[]).filter(function(x){return Number(x.valor)>0;});
    if(!itens.length) return '<div class="sub2">Sem custos para compor.</div>';
    var cores=['#F47820','#231F20','#5A5556','#8C8582','#B7AEA8','#D8CFC9','#F6A35C'];
    var total=itens.reduce(function(s,x){return s+Number(x.valor||0);},0)||1;
    var acum=0,partes=[];
    itens.forEach(function(x,i){var ini=acum; acum+=Number(x.valor||0)/total*100; partes.push(cores[i%cores.length]+' '+ini.toFixed(2)+'% '+acum.toFixed(2)+'%');});
    var legenda=itens.map(function(x,i){var pct=Number(x.valor||0)/total*100; return '<div class="linha-leg"><span class="cor" style="background:'+cores[i%cores.length]+'"></span><span class="nome">'+esc(x.nome)+' <small>('+pct.toFixed(1).replace('.',',')+'%)</small></span><span class="valor">'+brl(x.valor)+'</span></div>';}).join('');
    return '<div class="dash-donut-wrap"><div class="dash-donut" style="background:conic-gradient('+partes.join(',')+')"><div class="dash-donut-centro"><b>'+itens.length+'</b><span>grupos</span></div></div><div class="dash-legenda">'+legenda+'</div></div>';
  }

  function rankingBarras(itens, tipo) {
    itens=itens||[];
    if(!itens.length) return '<div class="sub2">Sem dados para o ranking.</div>';
    var max=Math.max.apply(null,itens.map(function(x){return Number(tipo==='veiculo'?x.total:x.valor)||0;}).concat([1]));
    return '<div class="rank-list">'+itens.map(function(x){
      var valor=Number(tipo==='veiculo'?x.total:x.valor)||0;
      var nome=tipo==='veiculo'?x.placa:x.nome;
      var sub=tipo==='veiculo'?((x.descricao||'')+(x.centro?' • '+x.centro:'')):'';
      return '<div class="rank-row"><div class="rank-label"><b>'+esc(nome)+'</b><span>'+esc(sub)+'</span></div><div class="rank-track"><div class="rank-fill" style="width:'+Math.max(2,valor/max*100).toFixed(1)+'%"></div></div><div class="rank-value">'+brl(valor)+'</div></div>';
    }).join('')+'</div>';
  }

  /**
   * KPIs do grupo escolhido. Custo por km e km/l da frota INTEIRA não
   * significam nada quando ela vai de moto a carreta: a média fica entre dois
   * mundos e não descreve nenhum deles.
   */
  function kpisDoGrupo(d) {
    if (GRUPO_FROTA === 'TODAS') return d;
    var g = (d.grupos || []).filter(function (x) { return x.nome === GRUPO_FROTA; })[0];
    if (!g) return d;
    // Só os indicadores que mudam com o recorte. Evolução, composição e
    // pendências seguem sendo da frota inteira — e os títulos dizem isso.
    return {
      total: g.total, km: g.km, litros: g.litros, custoKm: g.custoKm,
      kmLitro: g.kmLitro, precoLitro: g.precoLitro, oficina: g.oficina,
      custoMedioVeiculo: g.custoMedioVeiculo, veiculos: g.veiculos,
      veiculosComCusto: g.veiculosComCusto,
      variacao: null,          // a variação do histórico é da frota toda
      lancamentosPeriodo: d.lancamentosPeriodo,
    };
  }

  function seletorGrupoFrota(d) {
    var grupos = d.grupos || [];
    if (grupos.length < 2) return '';
    return '<select id="grupoFrota" onchange="trocarGrupoFrota()" ' +
      'style="width:auto;min-width:170px">' +
      '<option value="TODAS"' + (GRUPO_FROTA === 'TODAS' ? ' selected' : '') + '>' +
        'Frota inteira</option>' +
      grupos.map(function (g) {
        return '<option value="' + esc(g.nome) + '"' +
          (GRUPO_FROTA === g.nome ? ' selected' : '') + '>' + esc(g.nome) +
          ' (' + g.veiculos + ')</option>';
      }).join('') + '</select>';
  }

  function renderizarInicio(d) {
    INICIO_CLIENTE = d;
    // Grupo que sumiu (categoria remapeada, parâmetro editado) volta para a
    // frota inteira, em vez de mostrar um painel vazio sem explicação.
    if (GRUPO_FROTA !== 'TODAS' &&
        !(d.grupos || []).some(function (g) { return g.nome === GRUPO_FROTA; })) {
      GRUPO_FROTA = 'TODAS';
    }
    var k = kpisDoGrupo(d);
    var recorte = GRUPO_FROTA === 'TODAS' ? '' : ' • ' + GRUPO_FROTA;
    el('titulo').textContent = d.empresa;
    atualizarSelo(d.pendencias);
    var delta=k.variacao===null||k.variacao===undefined?null:Number(k.variacao);
    var deltaTxt=delta===null?'Sem base anterior':(delta>0?'▲ ':'▼ ')+Math.abs(delta*100).toFixed(1).replace('.',',')+'% vs. anterior';
    var deltaCls=delta===null?'neutro':(delta>0?'alta':'baixa');
    var pend = Number(d.pendencias||0);
    var alerta = pend>0 ? '<div class="dash-alerta"><span style="font-size:17px">⚠️</span><div style="flex:1"><b>'+pend+' pendência(s) de conferência</b><br><span>Existem itens que precisam ser revisados antes do fechamento.</span></div><button class="acao secundaria" onclick="abrir(\'pendencias\')">Ver pendências</button></div>' : '';

    el('tela').innerHTML =
      '<div class="dash-head"><div><div class="dash-eyebrow">Visão executiva da frota</div><h2>'+esc(d.mesExtenso)+'</h2><p>Período operacional '+esc(d.periodo)+'</p></div>'+
      '<div class="dash-acoes">'+seletorGrupoFrota(d)+'<span class="dash-chip ok">Período aberto</span><button class="dash-refresh" onclick="telaInicio(true)">↻ Atualizar</button></div></div>'+alerta+
      '<div class="dash-kpis">'+
        '<div class="dash-kpi"><div class="label">Custo total do período'+esc(recorte)+'</div><div class="numero">'+brl(k.total)+'</div><span class="delta '+deltaCls+'">'+esc(deltaTxt)+'</span></div>'+
        '<div class="dash-kpi"><div class="label">Custo por KM'+esc(recorte)+'</div><div class="numero">'+brl(k.custoKm,3)+'</div><div class="nota">'+num(k.km)+' km rodados</div></div>'+
        '<div class="dash-kpi"><div class="label">Eficiência média'+esc(recorte)+'</div><div class="numero">'+num(k.kmLitro,2)+' km/L</div><div class="nota">'+num(k.litros,0)+' litros consumidos</div></div>'+
        '<div class="dash-kpi"><div class="label">Custo médio / veículo'+esc(recorte)+'</div><div class="numero">'+brl(k.custoMedioVeiculo)+'</div><div class="nota">'+num(k.veiculosComCusto)+' veículos com custo</div></div>'+
      '</div>'+
      '<div class="dash-mini">'+
        '<div class="item"><div class="r">'+(GRUPO_FROTA==='TODAS'?'Veículos ativos':'Veículos no grupo')+'</div><div class="v">'+num(GRUPO_FROTA==='TODAS'?d.veiculos:k.veiculos)+'</div></div>'+
        '<div class="item"><div class="r">Lançamentos no período</div><div class="v">'+num(d.lancamentosPeriodo)+'</div></div>'+
        '<div class="item"><div class="r">Preço médio / litro'+esc(recorte)+'</div><div class="v">'+brl(k.precoLitro,3)+'</div></div>'+
        '<div class="item"><div class="r">Oficina / manutenção'+esc(recorte)+'</div><div class="v">'+brl(k.oficina)+'</div></div>'+
      '</div>'+
      '<div class="dash-grid"><div class="dash-card"><div class="dash-card-head"><div><h3>Evolução mensal</h3><div class="hint">Frota inteira • histórico fechado + competência atual</div></div><span class="chip">12 meses</span></div><div class="dash-chart">'+graficoEvolucao(d)+'</div></div>'+
      '<div class="dash-card"><div class="dash-card-head"><div><h3>Composição do custo</h3><div class="hint">Participação das principais rubricas</div></div></div>'+graficoDonut(d)+'</div></div>'+
      '<div class="dash-grid meio"><div class="dash-card"><div class="dash-card-head"><div><h3>Maiores custos por veículo</h3><div class="hint">Top 8 da competência</div></div></div>'+rankingBarras(d.top,'veiculo')+'</div>'+
      '<div class="dash-card"><div class="dash-card-head"><div><h3>Custo por centro</h3><div class="hint">Centros com maior participação</div></div></div>'+rankingBarras(d.centros,'centro')+'</div></div>'+
      '<div class="dash-rodape">V'+esc(d.versao||'?')+' • Indicadores calculados em '+esc(d.geradoEm||'')+' • servidor '+num(d.tempoServidorMs||0)+' ms'+(d.cacheHit?' • cache':'')+diagnosticoRodape(d)+'</div>';
  }

  function telaInicio(forcarAtualizacao) {
    if (!forcarAtualizacao && INICIO_CLIENTE) { renderizarInicio(INICIO_CLIENTE); return; }
    el('tela').innerHTML = dashboardSkeleton();
    google.script.run.withSuccessHandler(function (d) {
      renderizarInicio(d);
    }).withFailureHandler(falha).webInicio(TOKEN, forcarAtualizacao === true);
  }

  function telaLancar() {
    el('tela').innerHTML =
      '<h2 class="titulo">Novo lançamento</h2>' +
      '<p class="sub">Período aberto: ' + dataBR(CONFIG.inicio) + ' a ' + dataBR(CONFIG.fim) + '</p>' +
      '<div class="cartao" style="max-width:620px">' +
        '<div class="linha">' +
          '<div><label for="data">Data</label><input type="date" id="data" min="' +
            CONFIG.inicio + '" max="' + CONFIG.fim + '" value="' + CONFIG.dataSugerida + '"></div>' +
          '<div><label for="placa">Veículo / patrimônio</label>' +
            '<input type="text" id="placa" list="listaVeiculosLanc" autocomplete="off" placeholder="placa ou nº patrimônio">' +
            datalistVeiculos('listaVeiculosLanc', true) +
            '<div class="sub2">Digite a placa/ID ou o Código Patrimônio.</div></div>' +
        '</div>' +
        '<label for="tipo">Tipo de despesa</label><select id="tipo">' +
          CONFIG.tipos.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') +
          '</select>' +
          '<div class="sub2" id="dicaTipo" style="margin-top:4px"></div>' +
        '<div id="blocoOficina" style="display:none;background:#FFF9F4;border:1px solid #F0B88E;border-radius:8px;padding:10px;margin-top:10px">' +
          '<div style="font-weight:800;margin-bottom:6px">Detalhamento da oficina</div>' +
          '<div class="linha"><div><label for="naturezaOficina">Natureza da despesa</label><select id="naturezaOficina">' +
            (CONFIG.naturezasOficina||[]).map(function(n){return '<option>'+esc(n)+'</option>';}).join('') + '</select></div>' +
          '<div style="flex:2"><label for="detalheOficina">Peça / serviço realizado</label>' +
            '<input type="text" id="detalheOficina" maxlength="500" placeholder="ex.: pastilha de freio dianteira / reparo alternador"></div></div>' +
          '<div class="sub2">Para despesas de oficina, informe também a NF/OS/documento e o valor.</div>' +
        '</div>' +
        '<div id="blocoAbastecimento" style="display:none;background:#F4F8FF;border:1px solid #A9C4EE;border-radius:8px;padding:10px;margin-top:10px">' +
          '<div style="font-weight:800;margin-bottom:6px">Abastecimento</div>' +
          '<label for="tipoAbastecimento">Origem do combustível</label>' +
          '<select id="tipoAbastecimento">' +
            (CONFIG.tiposAbastecimento||['Interno','Externo']).map(function(t){return '<option>'+esc(t)+'</option>';}).join('') +
          '</select>' +
          '<div class="sub2" id="dicaBomba" style="margin-top:6px"></div>' +
        '</div>' +
        '<div class="linha">' +
          '<div><label for="litros" id="rotuloLitros">Litros</label><input type="number" id="litros" step="0.001" min="0" inputmode="decimal">' +
            blocoBotijao('') + '</div>' +
          '<div><label for="valor">Valor R$</label><input type="number" id="valor" step="0.01" min="0" inputmode="decimal"></div>' +
        '</div>' +
        '<div id="blocoKm">' +
          '<label for="km">KM / horímetro</label>' +
          '<input type="number" id="km" step="1" min="0" inputmode="numeric">' +
          '<div class="sub2" id="dicaKm" style="margin-top:4px"></div>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-top:8px">' +
            '<input type="checkbox" id="forcarKm" style="width:auto">' +
            '<label for="forcarKm" style="margin:0;font-weight:400">Forçar KM menor que a última leitura</label>' +
          '</div>' +
        '</div>' +
        '<div class="linha">' +
          // Lista fechada, nao texto com sugestao: o servidor so aceita fornecedor
          // cadastrado, entao deixar digitar livre so produz erro depois de preencher.
          '<div><label for="fornecedor">Fornecedor <span style="font-weight:400">(opcional)</span></label>' +
            '<select id="fornecedor">' +
              '<option value="">— sem fornecedor —</option>' +
              (CONFIG.fornecedores||[]).map(function(f){return '<option>'+esc(f)+'</option>';}).join('') +
            '</select>' +
            ((CONFIG.fornecedores||[]).length ? '' :
              '<div class="sub2">Nenhum fornecedor cadastrado ainda.</div>') + '</div>' +
          '<div id="campoDocumento"><label for="documento">NF / OS / Documento</label>' +
            '<input type="text" id="documento" placeholder="número da NF, OS ou documento"></div>' +
        '</div>' +
        '<label for="observacao">Observação</label><textarea id="observacao" rows="2"></textarea>' +
        '<button class="acao" id="btnGravar" style="width:100%;margin-top:14px" onclick="gravar()">Gravar lançamento</button>' +
        '<div id="msgLanc" style="margin-top:10px"></div>' +
      '</div>' +
      '<div class="cartao" style="max-width:620px"><b>Últimos lançamentos</b>' +
        '<div id="ultimos"><div class="sub2">carregando…</div></div>' +
        '<div style="margin-top:10px"><button class="acao secundaria" onclick="abrir(\'lancamentos\')">' +
          '🗑️ Lançou errado? Corrigir / excluir</button></div></div>';

    // V4.8: o campo de veículo começa VAZIO (vir com a 1ª placa fazia lançar no veículo errado).
    el('placa').value = ''; el('placa').focus();
    el('tipo').addEventListener('change', function(){
      ajustarLitros(); ajustarOficina(); ajustarAbastecimento(); ajustarDicaTipo();
    });
    el('placa').addEventListener('change', consultarOdometro);
    el('tipoAbastecimento').addEventListener('change', ajustarAbastecimento);
    el('data').addEventListener('change', function(){
      if (ehCombustivel()) consultarCustoBomba();
    });
    el('litros').addEventListener('input', atualizarValorInterno);
    ajustarLitros();
    ajustarOficina();
    ajustarAbastecimento();
    ajustarDicaTipo();
    consultarOdometro();
    carregarUltimos();
  }

  /** V4.8: avisa antes de gravar quando o tipo é ativo (não soma no custo) ou exige NF. */
  function ajustarDicaTipo() {
    var dica = el('dicaTipo');
    if (!dica) return;
    var tipo = el('tipo').value;
    var partes = [];
    if ((CONFIG.tiposAtivo || []).indexOf(tipo) !== -1) {
      partes.push('Classificado como ATIVO (imobilizado): aparece no Resumo, mas não soma no custo operacional.');
    }
    if ((CONFIG.tiposExigemDocumento || []).indexOf(tipo) !== -1) partes.push('Informe a NF / documento.');
    dica.textContent = partes.join(' ');
  }

  function ehCombustivel() {
    return (CONFIG.tiposCombustivel || []).indexOf(el('tipo').value) !== -1;
  }

  /**
   * Item 3 do escopo: KM so aparece em combustivel. Manutencao, multa e pedagio
   * nao movem odometro, e o servidor recusa — mas recusar depois de digitar e a
   * pior forma de avisar.
   */
  function ajustarAbastecimento() {
    var combustivel = ehCombustivel();
    var doTanque = (CONFIG.tiposDoTanque || []).indexOf(el('tipo').value) !== -1;
    // KM so em combustivel; a origem Interno/Externo tambem vale para ARLA, que
    // sai do mesmo tanque mas nao movimenta odometro.
    el('blocoKm').style.display = combustivel ? 'block' : 'none';
    el('blocoAbastecimento').style.display = doTanque ? 'block' : 'none';
    if (!doTanque) {
      el('km').value = '';
      el('forcarKm').checked = false;
      el('valor').disabled = false;
      el('valor').placeholder = '';
      el('dicaBomba').textContent = '';
      el('campoDocumento').style.display = '';
      return;
    }
    // Interno nao tem preco proprio: o custo e o do tanque, calculado no servidor.
    // O campo fica travado para ninguem digitar um valor que sera sobrescrito.
    var interno = el('tipoAbastecimento').value === 'Interno';
    el('valor').disabled = interno;
    // Interno nao tem NF propria: a nota e a da carga do tanque, ja lancada em
    // "Carga na bomba". O campo some para ninguem inventar um numero.
    el('campoDocumento').style.display = interno ? 'none' : '';
    if (interno) {
      el('valor').value = '';
      el('valor').placeholder = 'calculado pela bomba';
      el('documento').value = '';
      consultarCustoBomba();
    } else {
      el('valor').placeholder = 'valor da NF';
      el('dicaBomba').textContent = 'Abastecimento externo exige NF e valor.';
    }
  }

  var CUSTO_BOMBA = null;

  function consultarCustoBomba() {
    var dica = el('dicaBomba');
    if (!dica) return;
    CUSTO_BOMBA = null;
    dica.textContent = 'consultando o custo do tanque…';
    google.script.run.withSuccessHandler(function (r) {
      if (!el('dicaBomba')) return;
      if (!r || !r.disponivel) {
        CUSTO_BOMBA = null;
        el('dicaBomba').innerHTML = '<span style="color:#A52422">Nenhuma carga de ' +
          esc(r && r.produto ? r.produto : 'combustível') + ' registrada até esta data. ' +
          'Lance a NF em "Carga na bomba" antes deste abastecimento.</span>';
        return;
      }
      CUSTO_BOMBA = r.custoMedio;
      el('dicaBomba').textContent = 'Custo médio do tanque: R$ ' +
        Number(r.custoMedio).toFixed(4).replace('.', ',') + '/L • saldo ' +
        num(r.saldo) + ' L de ' + r.produto + '.';
      atualizarValorInterno();
    }).withFailureHandler(function () {
      if (el('dicaBomba')) el('dicaBomba').textContent = '';
    }).webCustoBomba(TOKEN, el('data').value);
  }

  /** Previa do valor: o numero que vale e o que o servidor calcula ao gravar. */
  function atualizarValorInterno() {
    if (el('blocoAbastecimento').style.display === 'none') return;
    if (el('tipoAbastecimento').value !== 'Interno') return;
    if (CUSTO_BOMBA === null) return;
    var litros = Number(el('litros').value || 0);
    el('valor').value = litros > 0 ? (litros * CUSTO_BOMBA).toFixed(2) : '';
  }

  /**
   * Calculadora de botijões.
   *
   * A NF de GLP vem em UNIDADES — "Qtde 6 • botijão de 20 KG • R$ 213,00 cada" —
   * e o sistema guarda QUILOS. O operador lê "20 KG" na descrição e digita 20,
   * perdendo o 6: 120 kg viram 20, e o preço por quilo sai seis vezes maior.
   * Foi exatamente o que aconteceu com a EMP YALE N 02.
   *
   * A multiplicação é do sistema, não de quem digita.
   */
  function blocoBotijao(sufixo) {
    return '<div id="blocoBotijao' + sufixo + '" style="display:none;margin-top:6px;' +
      'background:#FFF7F0;border:1px solid #F0B88E;border-radius:6px;padding:8px">' +
      '<div class="sub2" style="margin-bottom:6px">A nota vem em unidades? Converta:</div>' +
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
        '<input type="number" id="botijaoQtd' + sufixo + '" min="0" step="1" ' +
          'placeholder="botijões" style="width:92px" oninput="calcularBotijao(\'' + sufixo + '\')">' +
        '<span class="sub2">×</span>' +
        '<select id="botijaoKg' + sufixo + '" style="width:110px" ' +
          'onchange="calcularBotijao(\'' + sufixo + '\')">' +
          '<option value="20">20 kg (P20)</option>' +
          '<option value="13">13 kg (P13)</option>' +
          '<option value="45">45 kg (P45)</option>' +
        '</select>' +
        '<span class="sub2" id="botijaoTotal' + sufixo + '"></span>' +
      '</div></div>';
  }

  function calcularBotijao(sufixo) {
    var qtd = Number(el('botijaoQtd' + sufixo) ? el('botijaoQtd' + sufixo).value : 0) || 0;
    var kg = Number(el('botijaoKg' + sufixo) ? el('botijaoKg' + sufixo).value : 0) || 0;
    var total = qtd * kg;
    var rotulo = el('botijaoTotal' + sufixo);
    if (rotulo) rotulo.textContent = total > 0 ? '= ' + num(total, 0) + ' kg' : '';
    // Escreve direto no campo que vale: deixar o operador copiar o resultado
    // seria recriar o mesmo erro um passo adiante.
    var destino = sufixo === '' ? el('litros') : el(sufixo);
    if (destino && total > 0) destino.value = total;
  }

  function ajustarLitros() {
    // V4.8: gás é medido em quilos.
    var ehKg = (CONFIG.tiposKg || []).indexOf(el('tipo').value) !== -1;
    if (el('rotuloLitros')) el('rotuloLitros').textContent =
      ehKg ? 'Quantidade (kg)' : 'Litros';
    if (el('blocoBotijao')) el('blocoBotijao').style.display = ehKg ? '' : 'none';
    var aceita = CONFIG.tiposComLitros.indexOf(el('tipo').value) !== -1;
    el('litros').disabled = !aceita;
    if (!aceita) el('litros').value = '';
  }

  function ajustarOficina() {
    var bloco = el('blocoOficina');
    if (!bloco) return;
    var eh = (CONFIG.tiposOficina || []).indexOf(el('tipo').value) !== -1;
    bloco.style.display = eh ? 'block' : 'none';
    if (!eh) {
      if (el('detalheOficina')) el('detalheOficina').value = '';
      if (el('naturezaOficina') && el('naturezaOficina').options.length) el('naturezaOficina').selectedIndex = 0;
    }
  }

  function consultarOdometro() {
    var dica = el('dicaKm');
    if (!dica) return;
    if (!String(el('placa').value || '').trim()) { dica.textContent = 'Digite a placa para ver a última leitura.'; return; }
    dica.textContent = 'consultando última leitura…';
    google.script.run.withSuccessHandler(function (ultimo) {
      dica.textContent = ultimo
        ? 'Última leitura: ' + num(ultimo.km) + ' em ' + ultimo.data
        : 'Sem leitura anterior registrada.';
    }).webUltimoOdometro(TOKEN, el('placa').value);
  }

  function carregarUltimos() {
    google.script.run.withSuccessHandler(function (itens) {
      var alvo = el('ultimos');
      if (!alvo) return;
      alvo.innerHTML = itens.length ? itens.map(function (l) {
        return '<div class="lista-item"><div>' + esc(l.placa) +
          '<div class="sub2">' + esc(l.data) + ' • ' + esc(l.tipo) + '</div></div>' +
          '<div>' + brl(l.valor) + '</div></div>';
      }).join('') : '<div class="sub2">Nenhum lançamento ainda.</div>';
    }).webUltimosLancamentos(TOKEN, 8);
  }

  function gravar(permitirDuplicado) {
    var botao = el('btnGravar');
    botao.disabled = true;
    botao.textContent = 'Gravando…';
    var dados = {
      data: el('data').value, placa: String(el('placa').value || '').trim(), tipo: el('tipo').value,
      litros: el('litros').value, valor: el('valor').value, km: el('km').value,
      forcarKm: el('forcarKm').checked,
      fornecedor: el('fornecedor') ? el('fornecedor').value : '',
      tipoAbastecimento: el('blocoAbastecimento') &&
        el('blocoAbastecimento').style.display !== 'none' && el('tipoAbastecimento')
        ? el('tipoAbastecimento').value : '',
      documento: el('documento').value, observacao: el('observacao').value,
      naturezaOficina: el('naturezaOficina') ? el('naturezaOficina').value : '',
      detalheOficina: el('detalheOficina') ? el('detalheOficina').value : '',
      permitirDuplicado: permitirDuplicado === true
    };
    google.script.run
      .withSuccessHandler(function (r) {
        botao.disabled = false;
        botao.textContent = 'Gravar lançamento';
        if (!r.ok && r.duplicidade && permitirDuplicado !== true) {
          if (confirm(r.mensagem + '\n\nSe você conferiu e este é realmente um segundo lançamento legítimo, deseja gravar mesmo assim?')) {
            gravar(true);
            return;
          }
        }
        el('msgLanc').innerHTML = '<div class="' + (r.ok ? 'ok-caixa' : 'erro-caixa') + '">' +
          esc(r.mensagem) + '</div>';
        if (r.ok) {
          ['litros', 'valor', 'km', 'documento', 'observacao', 'detalheOficina'].forEach(function (id) { if(el(id)) el(id).value = ''; });
          if (ehCombustivel()) consultarCustoBomba();
          if(el('naturezaOficina') && el('naturezaOficina').options.length) el('naturezaOficina').selectedIndex = 0;
          el('forcarKm').checked = false;
          consultarOdometro();
          carregarUltimos();
        }
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        botao.textContent = 'Gravar lançamento';

  function seletor(id, itens, primeiro) {
    return '<select id="' + id + '">' +
      (primeiro ? '<option>' + primeiro + '</option>' : '') +
      itens.map(function (i) { return '<option>' + esc(i) + '</option>'; }).join('') +

  function datalistVeiculos(idLista, somenteAtivos) {
    var itens = (CONFIG && CONFIG.veiculos) ? CONFIG.veiculos : (CONFIG && CONFIG.placas ? CONFIG.placas.map(function(p){return {placa:p,patrimonio:'',descricao:''};}) : []);
    if (somenteAtivos === true) itens = itens.filter(function(v){ return v.ativo !== false; });
    var html = [];
    itens.forEach(function(v){
      var placa=String(v.placa||''), pat=String(v.patrimonio||''), desc=String(v.descricao||'');
      html.push('<option value="'+esc(placa)+'" label="'+esc((pat?'Patrimônio '+pat+' • ':'')+desc)+'"></option>');
      if(pat) html.push('<option value="'+esc(pat)+'" label="'+esc(placa+(desc?' • '+desc:''))+'"></option>');
    });
    return '<datalist id="'+idLista+'">'+html.join('')+'</datalist>';
  }

  var FILTROS_RELATORIO = {};

  /** O campo de busca so aparece no relatorio que sabe usa-lo. */
  function ajustarTermo() {
    var usa = (FILTROS_RELATORIO[el('relTipo').value] || []).indexOf('termo') !== -1;
    el('campoTermo').style.display = usa ? '' : 'none';

  /**
   * Lista suspensa de veiculos.
   *
   * Era <input list=datalist>: o navegador so mostra as opcoes depois de digitar,
   * entao quem nao sabia a placa de cor ficava sem lista. <select> abre a frota
   * inteira num clique — e o proprio navegador aceita digitar para saltar.
   */
  function selectVeiculos(id, somenteAtivos) {
    var itens = (CONFIG && CONFIG.veiculos) ? CONFIG.veiculos.slice() : [];
    if (somenteAtivos === true) itens = itens.filter(function (v) { return v.ativo !== false; });
    itens.sort(function (a, b) { return String(a.placa).localeCompare(String(b.placa)); });
    return '<select id="' + id + '"><option>TODOS</option>' +
      itens.map(function (v) {
        var rotulo = String(v.placa || '') +
          (v.patrimonio ? ' • ' + v.patrimonio : '') +
          (v.descricao ? ' — ' + v.descricao : '');
        return '<option value="' + esc(String(v.placa || '')) + '">' + esc(rotulo) + '</option>';
      }).join('') + '</select>';
  }

  function rodarRelatorio(descricoes) {
    var tipo = el('relTipo').value;
    el('descRel').textContent = descricoes[tipo] || '';
    el('saidaRel').innerHTML = '<div class="carregando">calculando…</div>';
    google.script.run
      .withSuccessHandler(function (dados) {
        // Alguns relatorios trazem um consolidado por veiculo alem das linhas.
        // Ele vai ANTES da tabela: e o que responde "quem esta consumindo
        // manutencao" sem obrigar a rolar centenas de servicos.
        var resumo = '';
        if (dados && dados.porVeiculo && dados.porVeiculo.length) {
          resumo = tabela({
            colunas: [col('Placa'), col('Veículo'), col('Serviços', 'numero'),
              col('Natureza que mais pesou'), col('Total', 'moeda')],
            linhas: dados.porVeiculo.map(function (v) {
              return [v.placa, v.descricao, v.itens, v.naturezaPrincipal, v.valor];
            }),
            totais: [null, null,
              dados.porVeiculo.reduce(function (t, v) { return t + v.itens; }, 0),
              null,
              dados.porVeiculo.reduce(function (t, v) { return t + v.valor; }, 0)],
            mensagem: 'Consolidado por veículo, do que mais consumiu para o que menos.',
          });
        }
        el('saidaRel').innerHTML = resumo +
          tabela(dados, (dados && dados.mensagem) || 'Nenhum resultado para os filtros escolhidos.', { destacarBloco: true });
      })
      .withFailureHandler(function (erro) {
        el('saidaRel').innerHTML = '<div class="erro-caixa">' + esc(erro.message) + '</div>';
      })
      .webRelatorio(TOKEN, tipo, {
        centro: el('relCentro').value, categoria: el('relCategoria').value,
        // Campo vazio = todos os veículos.
        veiculo: String(el('relVeiculo').value || '').trim() || 'TODOS',
        termo: el('relTermo') ? el('relTermo').value : ''
      });
  }

  function rodarConsulta() {
    el('saidaConsulta').innerHTML = '<div class="carregando">buscando…</div>';
    google.script.run.withSuccessHandler(function (d) {
      if (!d.ok) {
        el('saidaConsulta').innerHTML = '<div class="aviso">' + esc(d.mensagem) + '</div>';
        return;
      }
      var i = d.indicadores;
      var kpis = [
        ['Custo total', brl(i.total)], ['KM rodados', num(i.km)],
        ['R$ por KM', brl(i.rsKm, 3)], ['KM por litro', num(i.kmLitro, 2)],
        ['Litros', num(i.litros, 3)], ['Combustível', brl(i.combustivel)],
        ['Oficina', brl(i.oficina)], ['Depreciação', brl(i.depreciacao)]
      ]
      // IPVA so entra quando o veiculo tem valor cadastrado: um KPI zerado em
      // toda a frota vira ruido e ensina o olho a ignorar o painel.
      .concat(Number(i.ipva) > 0 ? [['IPVA (1/12)', brl(i.ipva)]] : [])
      .map(function (k) {
        return '<div class="kpi"><div class="rotulo">' + k[0] + '</div>' +
          '<div class="valor">' + k[1] + '</div></div>';
      }).join('');

      var extrato = {
        colunas: [{ titulo: 'Data' }, { titulo: 'Tipo de Despesa' },
          { titulo: 'Natureza da Oficina' }, { titulo: 'Peça / Serviço' },
          { titulo: 'NF / OS / Documento' }, { titulo: 'Litros', tipo: 'decimal' },
          { titulo: 'Valor', tipo: 'moeda' }],
        linhas: d.lancamentos.map(function (l) {
          return [l.data, l.tipo, l.naturezaOficina || '', l.detalheOficina || '', l.documento,
            l.litros, l.valor];
        }),
        // Coluna 0 nula: quem escreve "TOTAL" no rodapé é o renderizador logo acima.
        totais: [null, null, null, null, null,
          d.lancamentos.reduce(function (s, l) { return s + l.litros; }, 0),
          d.lancamentos.reduce(function (s, l) { return s + l.valor; }, 0)]
      };

      el('saidaConsulta').innerHTML =
        '<div class="cartao"><b>' + esc(d.placa) + '</b>' + (d.patrimonio ? ' • Patrimônio ' + esc(d.patrimonio) : '') + ' — ' + esc(d.descricao) +
        ' <span class="chip">' + esc(d.categoria) + '</span> ' +
        '<span class="chip">' + esc(d.centro) + '</span>' +
        (d.ultimoOdometro ? '<div class="sub2" style="margin-top:6px">Última leitura: ' +
          num(d.ultimoOdometro.km) + ' km em ' + esc(d.ultimoOdometro.data) + '</div>' : '') +
        '</div>' +
        '<div class="kpis">' + kpis + '</div>' +
        tabela(extrato, 'Sem lançamentos no período.');
    }).withFailureHandler(falha).webConsultaVeiculo(TOKEN, el('consPlaca').value);
  }

  /**
   * Abre o formulario para cadastro OU edicao.
   *
   * Antes so existia "Novo veiculo": o webSalvarVeiculo do servidor sempre soube
   * editar (localiza pela placa e preserva o que nao vem no formulario), mas a
   * tela nunca carregava um veiculo existente. Trocar o centro de custo ou
   * desativar um veiculo so dava na mao, direto na aba.
   */
  function abrirFormVeiculo(veiculo) {
    var v = veiculo || {};
    var edicao = !!v.placa;
    el('formVeiculo').innerHTML =
      '<div class="cartao" style="max-width:660px">' +
        '<b>' + (edicao ? 'Editar ' + esc(v.placa) : 'Novo veículo') + '</b>' +
        '<div class="linha">' +
          '<div><label for="vPlaca">Placa / ID</label><input type="text" id="vPlaca"' +
            (edicao ? ' value="' + esc(v.placa) + '" readonly style="background:#F3F1F0"' : '') + '></div>' +
          '<div><label for="vDescricao">Descrição</label><input type="text" id="vDescricao" value="' +
            esc(v.descricao || '') + '"></div>' +
        '</div>' +
        '<div class="linha">' +
          '<div><label for="vCategoria">Categoria</label>' +
            seletor('vCategoria', OPCOES.categorias) + '</div>' +
          '<div><label for="vCentro">Centro de custo</label>' +
            seletor('vCentro', OPCOES.centros) + '</div>' +
        '</div>' +
        '<div class="linha">' +
          '<div><label for="vDepreciacao">Depreciação mensal</label>' +

          '<div><label for="vEmplacamento">Emplacamento</label>' +
            '<input type="number" id="vEmplacamento" step="0.01" min="0" value="' + (Number(v.emplacamento) || 0) + '"></div>' +
          '<div><label for="vSeguro">Seguro</label>' +
            '<input type="number" id="vSeguro" step="0.01" min="0" value="' + (Number(v.seguro) || 0) + '"></div>' +
        '</div>' +
        '<div class="linha">' +
          '<div><label for="vIpva">IPVA anual</label>' +
            '<input type="number" id="vIpva" step="0.01" min="0" value="' + (Number(v.ipva) || 0) + '">' +
            '<div class="sub2">O mapa cobra 1/12 por mês.</div></div>' +
          '<div><label for="vPreco">Preço comb. próprio</label>' +
            '<input type="number" id="vPreco" step="0.001" min="0" value="' + (Number(v.precoCombustivel) || 0) + '"></div>' +
          '<div><label for="vCodigo">Código patrimônio</label>' +
            '<input type="text" id="vCodigo" value="' + esc(v.codigo || '') + '"></div>' +
        '</div>' +
        '<div class="linha">' +
          '<div><label for="vAtivo">Situação</label>' +
            seletor('vAtivo', ['ATIVO', 'INATIVO']) + '</div>' +
          '<div style="flex:2"><div class="sub2" style="margin-top:26px">' +
            'Veículo inativo não aceita lançamento novo, mas continua no histórico.</div></div>' +

        '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
          '<button class="acao" onclick="salvarVeiculo()">Salvar</button>' +

          (edicao ? '<button class="acao perigo" style="margin-left:auto" onclick="excluirVeiculo()">🗑️ Excluir veículo</button>' : '') +
        '</div>' +
        '<div id="msgVeiculo" style="margin-top:10px"></div>' +
      '</div>';
    // seletor() nao aceita valor inicial: posicionar depois de montar e o que
    // impede um veiculo inativo de reaparecer como ativo ao ser editado.
    if (edicao) {
      definirSelect('vCategoria', v.categoria);
      definirSelect('vCentro', v.centro);
      definirSelect('vAtivo', v.ativo === false ? 'INATIVO' : 'ATIVO');
    }
    el('formVeiculo').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  function definirSelect(id, valor) {
    var campo = el(id);
    if (!campo || valor === undefined || valor === null) return;
    var alvo = String(valor).trim().toUpperCase();
    for (var i = 0; i < campo.options.length; i++) {
      if (String(campo.options[i].value).trim().toUpperCase() === alvo) {
        campo.selectedIndex = i;
        return;
      }
    }
  }

  /** Carrega o cadastro completo antes de abrir o formulario de edicao. */
  function editarVeiculo(placa) {

          status(r.mensagem);

        precoCombustivel: el('vPreco').value,
        ipva: el('vIpva') ? el('vIpva').value : 0,
        ativo: !el('vAtivo') || el('vAtivo').value !== 'INATIVO'
      });

  /**
   * V4.8: exclusão de veículo. O servidor recusa quando há histórico em período fechado
   * (aí o caminho é INATIVAR) e pede confirmação extra quando há lançamentos no período aberto.
   */
  function excluirVeiculo() {
    var placa = el('vPlaca').value;
    if (!placa) return;
    el('msgVeiculo').innerHTML =
      '<div class="cartao" style="border:2px solid #A52422;margin:0">' +
        '<b style="color:#A52422">Excluir o veículo ' + esc(placa) + '?</b>' +
        '<div class="sub2" style="margin:6px 0">Se ele tiver histórico em meses fechados, a exclusão é recusada: ' +
          'nesse caso use Situação INATIVO, que preserva os relatórios.</div>' +
        '<label for="motivoVeiculo">Justificativa (obrigatória, mínimo 10 caracteres)</label>' +
        '<textarea id="motivoVeiculo" rows="2"></textarea>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:8px">' +

  function rodarLancamentosCorrecao() {
    el('saidaCorrecao').innerHTML = '<div class="carregando">buscando…</div>';
    google.script.run.withSuccessHandler(function (d) {
      if (d.mensagem && !d.itens) { el('saidaCorrecao').innerHTML = '<div class="aviso">' + esc(d.mensagem) + '</div>'; return; }
      window.LANC_CORRECAO = d.itens || [];
      if (!window.LANC_CORRECAO.length) {
        el('saidaCorrecao').innerHTML = '<div class="cartao">Nenhum lançamento no período aberto (' + esc(d.periodo) + ') para esse filtro.</div>';
        return;
      }
      var linhas = window.LANC_CORRECAO.map(function (l, i) {
        return '<tr><td>' + esc(l.data) + '</td><td>' + esc(l.placa) + '</td><td>' + esc(l.tipo) +
          (l.detalhe ? '<div class="sub2">' + esc(l.detalhe) + '</div>' : '') + '</td>' +
          '<td>' + esc(l.documento) + '</td>' +
          '<td class="num">' + (l.litros ? num(l.litros, 3) : '') + '</td>' +
          '<td class="num">' + brl(l.valor) + '</td>' +
          '<td class="sub2">' + esc(l.id) + '</td>' +
          '<td style="white-space:nowrap"><button class="acao secundaria" style="padding:4px 10px" onclick="abrirCorrecaoLancamento(' + i + ')">Corrigir</button> ' +
          '<button class="acao perigo" style="padding:4px 10px" onclick="excluirLancamento(' + i + ')">Excluir</button></td></tr>';
      }).join('');
      el('saidaCorrecao').innerHTML =
        '<div class="cartao" style="padding:0;overflow:hidden"><div class="rolagem"><table><thead><tr>' +
        '<th>Data</th><th>Placa</th><th>Tipo</th><th>NF / Doc.</th><th class="num">Litros</th><th class="num">Valor</th><th>ID</th><th></th>' +
        '</tr></thead><tbody>' + linhas + '</tbody></table></div></div>' +
        '<div class="contagem">' + window.LANC_CORRECAO.length + ' lançamento(s) • período ' + esc(d.periodo) + '</div>';
    }).withFailureHandler(function (e) {
      el('saidaCorrecao').innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';
    }).webLancamentosCorrecao(TOKEN, { veiculo: el('corrVeiculo').value, termo: el('corrTermo').value });
  }

  // ------------------------------------------- corrigir lançamento (V4.8)
  function opcoesSelect(lista, atual, vazio) {
    return (vazio !== undefined ? '<option value="">' + esc(vazio) + '</option>' : '') +
      (lista || []).map(function (x) {
        return '<option' + (String(x) === String(atual) ? ' selected' : '') + '>' + esc(x) + '</option>';
      }).join('');
  }

  function abrirCorrecaoLancamento(i) {
    var l = (window.LANC_CORRECAO || [])[i];
    if (!l) return;
    window.LANC_CORRIGIR = l;
    var tipoAtual = (CONFIG.tipos || []).indexOf(l.tipoOriginal) !== -1 ? l.tipoOriginal : '';
    el('painelExclusao').innerHTML =
      '<div class="cartao" style="border:2px solid #F47820;max-width:680px">' +
        '<b>Corrigir lançamento</b> <span class="sub2">' + esc(l.id || 'sem ID') + '</span>' +
        '<div class="linha">' +
          '<div><label for="cxData">Data</label><input type="date" id="cxData" min="' + CONFIG.inicio + '" max="' + CONFIG.fim + '" value="' + esc(l.dataIso) + '"></div>' +
          '<div><label for="cxPlaca">Veículo / patrimônio</label><input type="text" id="cxPlaca" list="listaVeiculosCx" autocomplete="off" value="' + esc(l.placa) + '">' +
            datalistVeiculos('listaVeiculosCx', true) + '</div>' +
        '</div>' +
        '<label for="cxTipo">Tipo de despesa</label><select id="cxTipo">' + opcoesSelect(CONFIG.tipos, tipoAtual, tipoAtual ? undefined : '— escolha —') + '</select>' +
        '<div id="cxOficina">' +
          '<div class="linha"><div><label for="cxNatureza">Natureza</label><select id="cxNatureza">' + opcoesSelect(CONFIG.naturezasOficina, l.naturezaOficina) + '</select></div>' +
          '<div style="flex:2"><label for="cxDetalhe">Peça / serviço</label><input type="text" id="cxDetalhe" value="' + esc(l.detalheOficina) + '"></div></div>' +
        '</div>' +
        '<div id="cxTanque"><label for="cxOrigem">Origem do combustível</label><select id="cxOrigem">' +
          opcoesSelect(CONFIG.tiposAbastecimento || ['Interno', 'Externo'], l.tipoAbastecimento || 'Externo') + '</select>' +
          '<div class="sub2">Interno: o valor é recalculado pelo custo do tanque.</div></div>' +
        '<div class="linha">' +
          '<div><label for="cxLitros" id="cxRotuloLitros">Litros</label><input type="number" id="cxLitros" step="0.001" min="0" value="' + (l.litros || '') + '"></div>' +
          '<div><label for="cxValor">Valor R$</label><input type="number" id="cxValor" step="0.01" min="0" value="' + (l.valor || '') + '"></div>' +
          '<div id="cxKmBloco"><label for="cxKm">KM / horímetro</label><input type="number" id="cxKm" step="1" min="0" value="' + esc(l.km) + '"></div>' +
        '</div>' +
        '<div class="linha">' +
          '<div><label for="cxFornecedor">Fornecedor</label><select id="cxFornecedor">' + opcoesSelect(CONFIG.fornecedores, l.fornecedor, '— sem fornecedor —') + '</select></div>' +
          '<div><label for="cxDoc">NF / OS / Documento</label><input type="text" id="cxDoc" value="' + esc(l.documento) + '"></div>' +
        '</div>' +
        '<label for="cxObs">Observação</label><input type="text" id="cxObs" value="' + esc(l.observacao) + '">' +
        '<label for="cxMotivo">Motivo da correção (obrigatório, mínimo 10 caracteres)</label>' +
        '<input type="text" id="cxMotivo" placeholder="ex.: valor da NF digitado errado">' +
        '<div class="sub2" style="margin-top:6px">O original vai para "Lançamentos Excluídos" com o motivo e o corrigido é gravado com as mesmas validações de um lançamento novo. ' +
          'Se for abastecimento do tanque interno, o estoque e os custos posteriores são recalculados.</div>' +
        '<div style="display:flex;gap:8px;margin-top:10px">' +
          '<button class="acao" id="btnCx" onclick="salvarCorrecaoLancamento()">Salvar correção</button>' +
          '<button class="acao secundaria" onclick="el(\'painelExclusao\').innerHTML=\'\'">Cancelar</button>' +
        '</div><div id="msgCx" style="margin-top:8px"></div>' +
      '</div>';
    el('cxTipo').addEventListener('change', ajustarCorrecao);
    el('cxOrigem').addEventListener('change', ajustarCorrecao);
    ajustarCorrecao();
    el('painelExclusao').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function ajustarCorrecao() {
    var tipo = el('cxTipo').value;
    var doTanque = (CONFIG.tiposDoTanque || []).indexOf(tipo) !== -1;
    var combustivel = (CONFIG.tiposCombustivel || []).indexOf(tipo) !== -1;
    var comLitros = (CONFIG.tiposComLitros || []).indexOf(tipo) !== -1;
    el('cxOficina').style.display = (CONFIG.tiposOficina || []).indexOf(tipo) !== -1 ? '' : 'none';
    el('cxTanque').style.display = doTanque ? '' : 'none';
    el('cxKmBloco').style.display = combustivel ? '' : 'none';
    el('cxLitros').disabled = !comLitros;
    el('cxRotuloLitros').textContent = (CONFIG.tiposKg || []).indexOf(tipo) !== -1 ? 'Quantidade (kg)' : 'Litros';
    var interno = doTanque && el('cxOrigem').value === 'Interno';
    el('cxValor').disabled = interno;
    if (interno) el('cxValor').placeholder = 'calculado pela bomba';
  }

  function salvarCorrecaoLancamento() {
    var l = window.LANC_CORRIGIR;
    if (!l) return;
    var motivo = el('cxMotivo').value.trim();
    if (motivo.length < 10) { el('msgCx').innerHTML = '<div class="erro-caixa">Escreva o motivo da correção (mínimo 10 caracteres).</div>'; return; }
    if (!el('cxTipo').value) { el('msgCx').innerHTML = '<div class="erro-caixa">Escolha o tipo de despesa.</div>'; return; }
    var tipo = el('cxTipo').value;
    var doTanque = (CONFIG.tiposDoTanque || []).indexOf(tipo) !== -1;
    var combustivel = (CONFIG.tiposCombustivel || []).indexOf(tipo) !== -1;
    var oficina = (CONFIG.tiposOficina || []).indexOf(tipo) !== -1;
    var dados = {
      data: el('cxData').value, placa: String(el('cxPlaca').value || '').trim(), tipo: tipo,
      litros: el('cxLitros').disabled ? '' : el('cxLitros').value,
      valor: el('cxValor').disabled ? '' : el('cxValor').value,
      km: combustivel ? el('cxKm').value : '', forcarKm: false,
      fornecedor: el('cxFornecedor').value,
      tipoAbastecimento: doTanque ? el('cxOrigem').value : '',
      documento: el('cxDoc').value, observacao: el('cxObs').value,
      naturezaOficina: oficina ? el('cxNatureza').value : '',
      detalheOficina: oficina ? el('cxDetalhe').value : ''
    };
    el('btnCx').disabled = true;
    el('msgCx').innerHTML = '<div class="sub2">salvando a correção…</div>';
    google.script.run.withSuccessHandler(function (r) {
      el('btnCx').disabled = false;
      if (!r.ok) { el('msgCx').innerHTML = '<div class="erro-caixa">' + esc(r.mensagem) + '</div>'; return; }
      el('painelExclusao').innerHTML = '<div class="ok-caixa" style="max-width:680px">' + esc(r.mensagem) + '</div>';
      rodarLancamentosCorrecao(); carregarExcluidos();
    }).withFailureHandler(function (e) {
      el('btnCx').disabled = false;
      el('msgCx').innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';
    }).webCorrigirLancamento(TOKEN, l.id, { linha: l.linha, placa: l.placa, data: l.data }, dados, motivo);
  }

  function excluirLancamento(i) {
    var l = (window.LANC_CORRECAO || [])[i];
    if (!l) return;
    window.LANC_EXCLUIR = l;
    el('painelExclusao').innerHTML =
      '<div class="cartao" style="border:2px solid #A52422;max-width:620px">' +
        '<b style="color:#A52422">Excluir este lançamento?</b>' +
        '<div style="margin:8px 0">' + esc(l.data) + ' • <b>' + esc(l.placa) + '</b> • ' + esc(l.tipo) + ' • <b>' + brl(l.valor) + '</b>' +
          (l.documento ? ' • NF ' + esc(l.documento) : '') + '<div class="sub2">' + esc(l.id) + '</div></div>' +
        '<label for="motivoExclusao">Justificativa (obrigatória, mínimo 10 caracteres)</label>' +
        '<textarea id="motivoExclusao" rows="2" placeholder="ex.: valor digitado errado; a NF 123 é de R$ 150,00"></textarea>' +
        '<div style="display:flex;gap:8px;margin-top:10px">' +
          '<button class="acao perigo" id="btnConfirmaExclusao" onclick="confirmarExclusaoLancamento()">🗑️ Confirmar exclusão</button>' +
          '<button class="acao secundaria" onclick="el(\'painelExclusao\').innerHTML=\'\'">Cancelar</button>' +
        '</div><div id="msgExclusao" style="margin-top:8px"></div>' +
      '</div>';
    el('painelExclusao').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    el('motivoExclusao').focus();
  }

  function confirmarExclusaoLancamento() {
    var l = window.LANC_EXCLUIR;
    var motivo = el('motivoExclusao').value.trim();
    if (!l) return;
    if (motivo.length < 10) {
      el('msgExclusao').innerHTML = '<div class="erro-caixa">Escreva a justificativa com pelo menos 10 caracteres.</div>';
      return;
    }
    el('btnConfirmaExclusao').disabled = true;
    el('msgExclusao').innerHTML = '<div class="sub2">excluindo…</div>';
    google.script.run.withSuccessHandler(function (r) {
      if (!r.ok) {
        el('btnConfirmaExclusao').disabled = false;
        el('msgExclusao').innerHTML = '<div class="erro-caixa">' + esc(r.mensagem) + '</div>';
        return;
      }
      el('painelExclusao').innerHTML = '<div class="ok-caixa" style="max-width:620px">' + esc(r.mensagem) + '</div>';
      rodarLancamentosCorrecao(); carregarExcluidos();
    }).withFailureHandler(function (e) {
      el('btnConfirmaExclusao').disabled = false;
      el('msgExclusao').innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';
    }).webExcluirLancamento(TOKEN, l.id, motivo, { linha: l.linha, placa: l.placa, data: l.data });
  }

  function carregarExcluidos() {
    google.script.run.withSuccessHandler(function (d) {
      if (el('saidaExcluidos')) el('saidaExcluidos').innerHTML = tabela(d, 'Nenhuma exclusão registrada.');
    }).withFailureHandler(function () {}).webLancamentosExcluidos(TOKEN, 20);
  }

  // ------------------------------------------------- centros de custo (V4.9)
  // A tela era so leitura, com um seletor que alterava UM centro por vez e mandava
  // "edite na planilha" para o resto. Como o ajuste e mensal e mexe em varias lojas
  // ao mesmo tempo, virou tabela editavel com gravacao em lote: salvar uma a uma
  // deixaria a base num estado em que a soma nao fecha, que e exatamente o que o
  // aviso de 100% existe para denunciar.
  var CENTROS_DADOS = null;

  function seletorCompetencia(id, lista, atual, acao) {
    return '<label for="' + id + '">Competência</label><select id="' + id + '" onchange="' + acao + '">' +
      (lista || []).map(function (m) {
        return '<option value="' + esc(m) + '"' + (m === atual ? ' selected' : '') + '>' + esc(m) + '</option>';
      }).join('') + '</select>';
  }

  function atualizarSomaCentros() {
    var alvo = el('somaCentros');
    if (!alvo || !CENTROS_DADOS) return;
    var soma = 0;
    CENTROS_DADOS.itens.forEach(function (_, i) {
      var campo = el('pc' + i);
      if (campo) soma += Number(String(campo.value).replace(',', '.')) || 0;
    });
    var fecha = Math.abs(soma - 100) <= 0.01;
    alvo.className = fecha ? 'ok-caixa' : 'aviso';
    alvo.innerHTML = 'Soma dos percentuais: <b>' + num(soma, 3) + '%</b>' +
      (fecha ? ' — fecha em 100%.'
             : ' — não fecha 100%. O rateio é normalizado e continua batendo com o Resumo, ' +
               'mas confira se ficou faltando alguém.');
  }

  // ------------------------------------------- comprovantes atrasados (V4.11)
  // Comprovante que chega depois da competência fechar. Fica num registro
  // apartado que NÃO toca em fechamento nenhum, e só vira despesa quando alguém
  // clica em Incorporar — aí no período ABERTO, com a data original guardada.
  var COMPROVANTES_CLIENTE = null;
  var FILTRO_COMPROVANTE = 'PENDENTE';

  function telaComprovantes() {
    carregando('carregando comprovantes…');
    google.script.run.withSuccessHandler(desenharComprovantes)
      .withFailureHandler(falha).webComprovantes(TOKEN, FILTRO_COMPROVANTE);
  }

  function trocarFiltroComprovante() {
    FILTRO_COMPROVANTE = el('compFiltro') ? el('compFiltro').value : 'PENDENTE';
    telaComprovantes();
  }

  function desenharComprovantes(d) {
    COMPROVANTES_CLIENTE = d;
    var admin = SESSAO && SESSAO.perfil === 'ADMIN';

    var porComp = (d.porCompetencia || []).map(function (c) {
      return '<div class="item"><div class="r">' + esc(c.competencia) + '</div>' +
        '<div class="v">' + brl(c.valor) + '</div>' +
        '<div class="nota">' + c.qtd + ' comprovante(s)</div></div>';
    }).join('');

    var lista = (d.itens || []).map(function (i) {
      var acoes = '';
      if (admin && i.situacao === 'PENDENTE') {
        acoes =
          '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
            '<button class="acao" id="cinc_' + i.linha + '" ' +
              'onclick="incorporarComprovante(' + i.linha + ')">Incorporar no mês aberto</button>' +
            '<button class="acao secundaria" onclick="pedirDescarte(' + i.linha + ')">Descartar</button>' +
          '</div>' +
          '<div id="cdesc_' + i.linha + '"></div>';
      }
      return '<div class="cartao" style="margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
          '<div><b>' + esc(i.placa) + ' • ' + esc(i.data) + '</b>' +
            '<div class="sub2" style="margin-top:4px">' + esc(i.tipo) +
            (i.documento ? ' • NF ' + esc(i.documento) : '') +
            ' • ' + esc(i.centro) + '</div></div>' +
          '<span class="chip">' + esc(i.situacao) + '</span></div>' +
        '<div class="sub" style="margin:10px 0">' +
          'Competência de origem <b>' + esc(i.competencia) + '</b> • ' + brl(i.valor) +
          (i.litros ? ' • ' + num(i.litros, 2) + ' L' : '') +
          (i.km ? ' • KM ' + num(i.km) : '') + '</div>' +
        (i.observacao ? '<div class="sub2">' + esc(i.observacao) + '</div>' : '') +
        acoes + '<div id="cmsg_' + i.linha + '"></div></div>';
    }).join('');

    el('tela').innerHTML =
      '<div class="dash-head"><div><div class="dash-eyebrow">Fora do período</div>' +
        '<h2>Comprovantes atrasados</h2>' +
        '<p>Comprovante que chegou depois do fechamento. Fica registrado aqui e ' +
        '<b>não afeta nenhuma competência</b> até ser incorporado.</p></div></div>' +
      (d.pendentes
        ? '<div class="dash-mini">' +
            '<div class="item"><div class="r">Pendentes</div><div class="v">' + num(d.pendentes) + '</div></div>' +
            '<div class="item"><div class="r">Valor fora do mapa</div><div class="v">' + brl(d.valorPendente) + '</div></div>' +
            '<div class="item"><div class="r">Litros fora do mapa</div><div class="v">' + num(d.litrosPendentes, 2) + '</div></div>' +
          '</div>' +
          (porComp ? '<div class="sub" style="margin:4px 0 8px">Por competência de origem</div>' +
            '<div class="dash-mini">' + porComp + '</div>' : '')
        : '<div class="ok-caixa">Nenhum comprovante pendente.</div>') +
      cartaoRegistrarComprovante() +
      '<div class="barra"><div><label for="compFiltro">Mostrar</label>' +
        '<select id="compFiltro" onchange="trocarFiltroComprovante()">' +
        (d.situacoes || []).map(function (s) {
          return '<option value="' + esc(s) + '"' + (s === d.situacao ? ' selected' : '') +
            '>' + esc(s) + '</option>';
        }).join('') + '</select></div></div>' +
      (lista || '<div class="cartao sub">Nenhum comprovante nesta situação.</div>');
  }

  function cartaoRegistrarComprovante() {

  function desenharOrcamento(dados) {
    ORCAMENTO_DADOS = dados;

        'estourar até o fim do período:</b> ' + esc(vaiEstourar.map(function (l) {
          return l[0] + ' (projeção ' + brl(l[5]) + ' contra ' + brl(l[1]) + ')';

        return '<tr><td>' + esc(item.centro) + '</td><td class="num">' +
          '<input type="number" id="ov' + i + '" step="0.01" min="0" inputmode="decimal" ' +
          'style="width:140px;text-align:right" value="' + Number(item.valor).toFixed(2) +
          '"></td></tr>';
      }).join('');
      edicao =
        '<div class="cartao" style="margin-top:18px">' +
          '<b>Definir o previsto de ' + esc(dados.competencia) + '</b>' +
          '<div class="rolagem" style="margin-top:12px"><table><thead><tr>' +

            'onclick="salvarOrcamento()">Salvar orçamento de ' + esc(dados.competencia) + '</button>' +
          '<div id="msgOrcamento" style="margin-top:10px"></div>' +
        '</div>';
    }

    el('tela').innerHTML =
      '<h2 class="titulo">Orçamento por centro de custo</h2>' +
      '<p class="sub">Previsto × realizado. O realizado é o <b>total do centro depois do ' +
        'rateio</b> — o mesmo número da tela de rateio.</p>' +

        seletorCompetencia('orcMes', dados.competencias, dados.competencia, 'recarregarOrcamento()') +
      '</div></div>' + destaque +
