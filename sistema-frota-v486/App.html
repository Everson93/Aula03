  function classeStatusPendencia(status) {
    status = String(status || '').toUpperCase();
    if (status === 'PENDENTE') return 'erro-caixa';
    if (status === 'EM ANÁLISE') return 'aviso';
    return 'ok-caixa';
  }

  /**
   * Opcoes do filtro COM A CONTAGEM de cada valor.
   *
   * Sem o numero, "110 pendencias" nao diz nada sobre o que fazer: pode ser um
   * problema em 110 veiculos ou 110 vezes o mesmo problema — e a acao e bem
   * diferente nos dois casos.
   */
  function opcoesFiltroPendencias(lista, atual, rotuloTodos) {
    var contagem = {};
    (lista || []).forEach(function (v) {
      v = String(v || '').trim();
      if (v) contagem[v] = (contagem[v] || 0) + 1;
    });
    var valores = Object.keys(contagem).sort(function (a, b) {
      // Mais frequente primeiro: e por onde se tira mais pendencia de uma vez.
      if (contagem[b] !== contagem[a]) return contagem[b] - contagem[a];
      return a.localeCompare(b, 'pt-BR');
    });
    var total = (lista || []).length;
    return '<option value="TODOS"' + (atual === 'TODOS' ? ' selected' : '') + '>' +
        esc(rotuloTodos) + ' (' + total + ')</option>' +
      valores.map(function (v) {
        return '<option value="' + esc(v) + '"' + (v === atual ? ' selected' : '') + '>' +
          esc(v) + ' (' + contagem[v] + ')</option>';
      }).join('');
  }


  function aplicarFiltrosPendencias() {
    if (!PENDENCIAS_CLIENTE) return;
    FILTRO_PEND_VEICULO = el('filtroPendVeiculo') ? el('filtroPendVeiculo').value : FILTRO_PEND_VEICULO;
    FILTRO_PEND_TIPO = el('filtroPendTipo') ? el('filtroPendTipo').value : FILTRO_PEND_TIPO;
    FILTRO_PEND_SITUACAO = el('filtroPendSituacao') ? el('filtroPendSituacao').value : FILTRO_PEND_SITUACAO;
    renderPendencias(PENDENCIAS_CLIENTE);
  }

  function limparFiltrosPendencias() {
    FILTRO_PEND_SITUACAO = 'ABERTAS';
    FILTRO_PEND_VEICULO = 'TODOS';
    FILTRO_PEND_TIPO = 'TODOS';
    if (PENDENCIAS_CLIENTE) renderPendencias(PENDENCIAS_CLIENTE);
  }

  /**
   * Campo que resolve a pendencia de verdade.
   *
   * Antes dava para marcar RESOLVIDO escrevendo qualquer coisa na observacao,
   * e o lancamento continuava sem o dado. O ajuste vem PRIMEIRO no cartao, e o
   * Status/Observacao fica abaixo, para o caminho obvio ser o que corrige.
   */
  function blocoCorrecao(p) {
    var c = p.correcao;
    if (!c) return '';
    var admin = SESSAO && SESSAO.perfil === 'ADMIN';
    if (c.somenteAdmin && !admin) {
      return '<div class="sub2" style="margin:0 0 10px">Esta correção mexe no cadastro do ' +
        'veículo — só ADMIN.</div>';
    }
    // Uma pendência pode ter mais de um campo (preço fora da curva: valor OU
    // quantidade). Preenche-se só o que está errado.
    var campos = (c.campos || []).map(function (campo, i) {
      var id = 'pfix_' + p.linha + '_' + i;
      var entrada;
      if (campo.tipo === 'lista') {
        var opcoes = (PENDENCIAS_CLIENTE && PENDENCIAS_CLIENTE.listas &&
          PENDENCIAS_CLIENTE.listas[campo.lista]) || [];
        entrada = '<select id="' + id + '"><option value="">— escolha —</option>' +
          opcoes.map(function (o) {
            return '<option value="' + esc(o) + '">' + esc(o) + '</option>';
          }).join('') + '</select>';
      } else if (campo.tipo === 'numero') {
        entrada = '<input type="number" step="0.01" inputmode="decimal" id="' + id + '">' +
          (campo.botijao ? blocoBotijao(id) : '');
      } else if (campo.tipo === 'data') {
        entrada = '<input type="date" id="' + id + '">';
      } else {
        entrada = '<input type="text" id="' + id + '" maxlength="300" placeholder="' +
          esc(campo.ajuda || '') + '">';
      }
      if (campo.botijao) {
        // Na correção o bloco já nasce visível: a pendência é justamente de
        // quantidade em kg, não há outro tipo para alternar.
        entrada = entrada.replace('id="blocoBotijao' + id + '" style="display:none;',
          'id="blocoBotijao' + id + '" style="');
      }
      return '<div style="flex:1;min-width:180px">' +
        '<label for="' + id + '">' + esc(campo.rotulo) + '</label>' + entrada +
        (campo.ajuda ? '<div class="sub2" style="margin-top:4px">' + esc(campo.ajuda) +
          '</div>' : '') + '</div>';
    }).join('');

    var varios = (c.campos || []).length > 1;
    return '<div class="cartao" style="background:#FFF7F0;margin:0 0 12px">' +
      (varios ? '<div class="sub2" style="margin-bottom:8px">Preencha <b>só o campo ' +
        'que está errado</b> — o outro fica como está.</div>' : '') +
      '<div class="linha">' + campos +
        '<div style="flex:0 0 auto;align-self:flex-start;margin-top:22px">' +
          '<button class="acao" id="pfixb_' + p.linha + '" onclick="corrigirPendencia(' +
          p.linha + ')">Corrigir</button></div></div>' +
      '<div class="sub2" style="margin-top:6px">' +
        esc(c.aba + (c.linha ? ', linha ' + c.linha : ', pelo cadastro do veículo')) +
      '</div>' +
      (c.id ? '<div class="sub2" style="margin-top:2px">ID do lançamento: <b>' +
        esc(c.id) + '</b> — é por ele que você acha a despesa em ' +
        '“Corrigir / excluir lançamento”.</div>' : '') +
      '<div id="pfixm_' + p.linha + '"></div></div>';
  }

  /**
   * Caminho certo para a pendencia que NAO se resolve por um campo.
   *
   * Antes a tela nao dizia nada e sobrava Status/Observacao — que e o mesmo que
   * nada. Agora mostra ou o botao da rotina, ou o atalho para a tela onde aquilo
   * se resolve, ou a explicacao de por que nao ha o que corrigir.
   */
  function blocoAcao(p) {
    var a = p.acao;
    if (!a || p.correcao) return '';
    var admin = SESSAO && SESSAO.perfil === 'ADMIN';
    var botao = '';
    if (a.tipo === 'rotina') {
      botao = admin
        ? '<button class="acao" id="pacb_' + p.linha + '" onclick="rodarAcaoPendencia(' +
          p.linha + ')">' + esc(a.rotulo) + '</button>'
        : '<span class="sub2">Esta rotina é de ADMIN.</span>';
    } else if (a.tipo === 'atalho') {
      botao = '<button class="acao secundaria" onclick="abrir(\'' + esc(a.tela) +
        '\')">' + esc(a.rotulo) + '</button>';
    }
    return '<div class="cartao" style="background:#F4F8FF;margin:0 0 12px">' +
      '<div class="sub" style="margin:0 0 ' + (botao ? '10px' : '0') + '">' +
        esc(a.explicacao) + '</div>' + botao +
      '<div id="pacm_' + p.linha + '"></div></div>';
  }

  function rodarAcaoPendencia(linha) {
    var botao = el('pacb_' + linha);
    var rotulo = botao.textContent;
    botao.disabled = true;
    botao.textContent = 'Executando…';
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r.ok) {
          botao.disabled = false;
          botao.textContent = rotulo;
          el('pacm_' + linha).innerHTML = '<div class="erro-caixa" style="margin-top:8px">' +
            esc(r.mensagem) + '</div>';
          return;
        }
        status(r.mensagem);
        atualizarSelo(r.pendentes || 0);
        telaPendencias();
      })
      .withFailureHandler(function (e) {
        botao.disabled = false;
        botao.textContent = rotulo;
        el('pacm_' + linha).innerHTML = '<div class="erro-caixa" style="margin-top:8px">' +
          esc(e.message) + '</div>';
      })
      .webAcaoPendencia(TOKEN, linha);
  }

  function corrigirPendencia(linha) {
    var botao = el('pfixb_' + linha);
    var item = (PENDENCIAS_CLIENTE && PENDENCIAS_CLIENTE.linhas || [])
      .filter(function (x) { return x.linha === linha; })[0];
    if (!item || !item.correcao) return;
    var valores = {};
    (item.correcao.campos || []).forEach(function (campo, i) {
      var el_ = el('pfix_' + linha + '_' + i);
      if (el_) valores[campo.chave] = el_.value;
    });
    botao.disabled = true;
    botao.textContent = 'Gravando…';
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r.ok) {
          botao.disabled = false;
          botao.textContent = 'Corrigir';
          el('pfixm_' + linha).innerHTML = '<div class="erro-caixa" style="margin-top:8px">' +
            esc(r.mensagem) + '</div>';
          return;
        }
        // Gravou mas não conseguiu refazer a lista: isso TEM de aparecer como
        // erro, senão o operador vê verde, continua vendo o item, e corrige de
        // novo achando que não pegou.
        if (r.revalidou === false) {
          botao.disabled = false;
          botao.textContent = 'Corrigir';
          el('pfixm_' + linha).innerHTML = '<div class="erro-caixa" style="margin-top:8px">' +
            esc(r.mensagem) + '</div>';
          return;
        }
        // Gravou, revalidou, e o problema CONTINUA: fica na tela em amarelo, do
        // lado do campo, em vez de virar um toast verde que some em 7 segundos.
        if (r.resolvida === false) {
          botao.disabled = false;
          botao.textContent = 'Corrigir';
          el('pfixm_' + linha).innerHTML = '<div class="aviso" style="margin-top:8px">' +
            esc(r.mensagem) + '</div>';
          atualizarSelo(r.pendentes || 0);
          return;
        }
        // A lista inteira e refeita: corrigir um campo pode resolver mais de uma
        // pendencia da mesma linha, e os numeros de linha mudam na revalidacao.
        status(r.mensagem);
        atualizarSelo(r.pendentes || 0);
        telaPendencias();
      })
      .withFailureHandler(function (e) {
        botao.disabled = false;
        botao.textContent = 'Corrigir';
        el('pfixm_' + linha).innerHTML = '<div class="erro-caixa" style="margin-top:8px">' +
          esc(e.message) + '</div>';
      })
      .webCorrigirPendencia(TOKEN, linha, valores);
  }

  function renderPendencias(d) {
    PENDENCIAS_CLIENTE = d || { total:0, pendentes:0, analise:0, linhas:[] };
    atualizarSelo(PENDENCIAS_CLIENTE.total || 0);
    var podeRevalidar = SESSAO && SESSAO.perfil === 'ADMIN';
    var todos = PENDENCIAS_CLIENTE.linhas || [];
    var placas = todos.map(function(p){ return p.placa || ''; });
    var tipos = todos.map(function(p){ return p.problema || ''; });

    // Se o filtro selecionado deixou de existir após uma revalidação, volta para TODOS.
    if (FILTRO_PEND_VEICULO !== 'TODOS' && placas.indexOf(FILTRO_PEND_VEICULO) === -1) FILTRO_PEND_VEICULO = 'TODOS';
    if (FILTRO_PEND_TIPO !== 'TODOS' && tipos.indexOf(FILTRO_PEND_TIPO) === -1) FILTRO_PEND_TIPO = 'TODOS';

    // Sem este filtro, item RESOLVIDO ficava na tela para sempre: ele sai da
    // CONTAGEM, não da lista. É provavelmente o que faz parecer que "mesmo
    // corrigindo, elas permanecem ali".
    var resolvidos = todos.filter(function(p){ return p.status === 'RESOLVIDO'; }).length;
    var filtradas = todos.filter(function(p){
      if (FILTRO_PEND_VEICULO !== 'TODOS' && String(p.placa || '') !== FILTRO_PEND_VEICULO) return false;
      if (FILTRO_PEND_TIPO !== 'TODOS' && String(p.problema || '') !== FILTRO_PEND_TIPO) return false;
      if (FILTRO_PEND_SITUACAO === 'ABERTAS' && p.status === 'RESOLVIDO') return false;
      if (FILTRO_PEND_SITUACAO !== 'ABERTAS' && FILTRO_PEND_SITUACAO !== 'TODOS'
          && p.status !== FILTRO_PEND_SITUACAO) return false;
      return true;
    });

    var linhas = filtradas.map(function (p) {
      return '<div class="cartao" style="margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">'+
          '<div><b>'+esc(p.problema)+'</b><div class="sub2" style="margin-top:4px">'+esc(p.origem)+' • '+esc(p.placa||'sem veículo')+'</div></div>'+
          '<span class="chip">'+esc(p.status)+'</span></div>'+
        '<div class="sub" style="margin:10px 0">'+esc(p.detalhe||'Sem detalhe adicional')+'</div>'+
        blocoCorrecao(p)+blocoAcao(p)+
        '<div class="linha"><div><label>Status</label><select id="pst_'+p.linha+'">'+
          // Pendência com conserto por campo NÃO oferece RESOLVIDO: o sistema
          // reverteria na próxima verificação, porque o problema continua na
          // base. Oferecer o que vai ser desfeito é o que criava o laço de
          // "eu resolvo e ela permanece ali".
          (p.correcao ? ['PENDENTE','EM ANÁLISE'] : ['PENDENTE','EM ANÁLISE','RESOLVIDO'])
            .map(function(st){ return '<option'+(st===p.status?' selected':'')+'>'+st+'</option>'; }).join('')+
        '</select></div><div style="flex:2"><label>Observação</label><input id="pobs_'+p.linha+'" value="'+esc(p.observacao||'')+'" placeholder="ação tomada / responsável"></div></div>'+
        (p.correcao ? '<div class="sub2" style="margin-top:6px">Para esta pendência, ' +
          'resolver é <b>corrigir</b> no campo acima. Marcar como resolvida não mudaria ' +
          'o dado, e ela voltaria na próxima verificação.</div>' : '')+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px">'+
          '<span class="sub2">Validado em '+esc(p.validadoEm||'—')+'</span>'+
          '<button class="acao secundaria" onclick="salvarPendencia('+p.linha+')">Salvar</button></div></div>';
    }).join('');

    var filtrosAtivos = FILTRO_PEND_VEICULO !== 'TODOS' || FILTRO_PEND_TIPO !== 'TODOS' ||
      FILTRO_PEND_SITUACAO !== 'ABERTAS';
    el('tela').innerHTML =
      '<div class="dash-head"><div><div class="dash-eyebrow">Controle operacional</div><h2>Pendências de Conferência</h2><p>Filtre por veículo ou pelo tipo de inconsistência para revisar a fila com mais rapidez.</p></div>'+
      '<div class="dash-acoes">'+(podeRevalidar?'<button class="dash-refresh" onclick="revalidarPendencias()">↻ Revalidar</button>':'')+'</div></div>'+
      '<div class="dash-mini">'+
        '<div class="item"><div class="r">Em aberto</div><div class="v">'+num(PENDENCIAS_CLIENTE.total||0)+'</div></div>'+
        '<div class="item"><div class="r">Pendentes</div><div class="v">'+num(PENDENCIAS_CLIENTE.pendentes||0)+'</div></div>'+
        '<div class="item"><div class="r">Em análise</div><div class="v">'+num(PENDENCIAS_CLIENTE.analise||0)+'</div></div>'+
        '<div class="item"><div class="r">Exibindo</div><div class="v">'+num(filtradas.length)+'</div><div class="nota">de '+num(todos.length)+' registro(s)</div></div></div>'+
      '<div class="cartao" style="margin-bottom:14px">'+
        '<div class="linha">'+
          '<div><label for="filtroPendVeiculo">Veículo</label><select id="filtroPendVeiculo" onchange="aplicarFiltrosPendencias()">'+opcoesFiltroPendencias(placas,FILTRO_PEND_VEICULO,'Todos os veículos')+'</select></div>'+
          '<div><label for="filtroPendTipo">Tipo de pendência</label><select id="filtroPendTipo" onchange="aplicarFiltrosPendencias()">'+opcoesFiltroPendencias(tipos,FILTRO_PEND_TIPO,'Todos os tipos')+'</select></div>'+
          '<div><label for="filtroPendSituacao">Situação</label><select id="filtroPendSituacao" onchange="aplicarFiltrosPendencias()">'+
            ['ABERTAS','PENDENTE','EM ANÁLISE','RESOLVIDO','TODOS'].map(function(sit){
              var rot = sit === 'ABERTAS' ? 'Em aberto (esconde resolvidas)' : sit;
              var n = sit === 'ABERTAS' ? todos.length - resolvidos
                    : sit === 'TODOS' ? todos.length
                    : todos.filter(function(p){ return p.status === sit; }).length;
              return '<option value="'+sit+'"'+(sit===FILTRO_PEND_SITUACAO?' selected':'')+'>'+
                esc(rot)+' ('+n+')</option>';
            }).join('')+'</select></div>'+
          '<div style="flex:0 0 auto;align-self:flex-end"><button class="acao secundaria" onclick="limparFiltrosPendencias()"'+(filtrosAtivos?'':' disabled')+'>Limpar filtros</button></div>'+
        '</div></div>'+
      (linhas || (todos.length ? '<div class="aviso">Nenhuma pendência corresponde aos filtros selecionados.</div>' : '<div class="ok-caixa">Nenhuma pendência ativa. Os dados estão consistentes.</div>'));
  }

  function telaPendencias() {
    carregando('carregando pendências…');
    google.script.run.withSuccessHandler(renderPendencias).withFailureHandler(falha).webPendencias(TOKEN);
  }

  function salvarPendencia(linha) {
    var statusP = el('pst_'+linha).value;
    var obs = el('pobs_'+linha).value;
    // Manda junto o problema que ESTA tela está mostrando nessa linha. Se alguém
    // revalidou no meio, o servidor recusa em vez de gravar no item errado.
    var atual = (PENDENCIAS_CLIENTE && PENDENCIAS_CLIENTE.linhas || [])
      .filter(function (p) { return p.linha === linha; })[0];
    google.script.run.withSuccessHandler(function(r){
      status(r.mensagem || 'Pendência atualizada.', r.ok === false);
      telaPendencias();
    }).withFailureHandler(falha)
      .webAtualizarPendencia(TOKEN, linha, statusP, obs, atual ? atual.problema : '');
  }

  function revalidarPendencias() {
    carregando('revalidando dados…');
    google.script.run.withSuccessHandler(function(d){
      atualizarSelo(d.total || 0);
      telaPendencias();
    }).withFailureHandler(falha).webRevalidarPendencias(TOKEN);
  }

  var DEP_COMPETENCIA = '';
  var DEP_ANALISE = null;
  var DEP_DIVERG = null;

  function telaDepreciacao(mes) {
    carregando('conferindo depreciação…');
    google.script.run.withSuccessHandler(renderDepreciacao).withFailureHandler(falha)
      .webDepreciacao(TOKEN, mes || '');
  }

  function renderDepreciacao(d) {
    var st = d.status || {};
    DEP_COMPETENCIA = d.competencia || st.mes || '';
    DEP_ANALISE = null;
    var liberada = st.liberada !== false;
    var bens = d.bens || [];
    var naAberta = DEP_COMPETENCIA === d.competenciaAberta;

    var opcoes = (d.competencias || []).map(function (m) {
      return '<option value="' + esc(m) + '"' + (m === DEP_COMPETENCIA ? ' selected' : '') + '>' +
        esc(m) + (m === d.competenciaAberta ? ' (aberta)' : '') + '</option>';
    }).join('');

    var linhasBens = bens.map(function (b) {
      return '<tr><td><b>' + esc(b.bem) + '</b><div class="sub2">' + esc(b.descricao || '') + '</div></td>' +
        '<td>' + esc(b.placa || '') + '</td><td>' + esc(b.centro || '') + '</td>' +
        '<td class="num">' + brl(b.valor) + '</td>' +
        '<td><span class="chip">' + esc(b.origem || '') + '</span></td>' +
        '<td><button class="acao secundaria" style="padding:4px 10px;font-size:12px" ' +
        'onclick="depEditarBem(\'' + esc(b.bem) + '\',' + Number(b.valor || 0) + ')">editar</button> ' +
        '<button class="acao secundaria" style="padding:4px 10px;font-size:12px" ' +
        'onclick="depExcluirBem(\'' + esc(b.bem) + '\')">remover</button></td></tr>';
    }).join('');

    var linhasVeic = (st.itens || [])
      .filter(function (i) { return i.valorMensal > 0 || i.lancado > 0 || i.lancadoForaData > 0; })
      .map(function (i) {
        var reserva = i.origemValor === 'CADASTRO';
        return '<tr><td><b>' + esc(i.placa) + '</b><div class="sub2">' + esc(i.descricao || '') + '</div></td>' +
          '<td>' + esc(i.centro || '') + '</td><td class="num">' + brl(i.valorMensal) +
          (reserva ? '<div class="sub2">reserva do cadastro</div>' : '') + '</td>' +
          '<td class="num">' + brl(Number(i.lancado || 0) + Number(i.lancadoForaData || 0)) + '</td>' +
          '<td><span class="chip">' + esc(i.situacao) + '</span></td></tr>';
      }).join('');

    // A divergência vem com a tela: o botão já nasce dizendo quantas são, em
    // vez de obrigar a clicar para descobrir.
    DEP_DIVERG = d.divergencias || null;
    var botaoDivergencias = '';
    if (DEP_DIVERG && DEP_DIVERG.total) {
      botaoDivergencias = DEP_DIVERG.ajustaveis
        ? '<button class="dash-refresh" onclick="depAjustarTodas(this)">' +
          '⚖️ Acertar ' + num(DEP_DIVERG.ajustaveis) + ' divergência(s)</button>'
        : '<button class="dash-refresh" disabled title="Nenhuma é ajustável automaticamente">' +
          '⚖️ ' + num(DEP_DIVERG.total) + ' divergência(s) manual(is)</button>';
    }

    var botaoGerar = !naAberta
      ? '<button class="dash-refresh" disabled title="Só a competência aberta gera lançamento">Gerar pendentes</button>'
      : (liberada
        ? '<button class="dash-refresh" onclick="gerarDepreciacao()">Gerar pendentes</button>'
        : '<button class="dash-refresh" disabled title="Disponível em ' + esc(st.dataLancamento || '') + '">Disponível em ' + esc(st.dataLancamento || '') + '</button>');

    el('tela').innerHTML =
      '<div class="dash-head"><div><div class="dash-eyebrow">Competência patrimonial</div>' +
        '<h2>Depreciação mensal</h2><p>' + esc(st.mesExtenso || '') + ' • ' + esc(st.periodo || '') + '</p></div>' +
        '<div class="dash-acoes">' +
          '<select id="depMes" onchange="telaDepreciacao(this.value)" style="max-width:200px">' + opcoes + '</select> ' +
          botaoDivergencias + ' ' + botaoGerar + '</div></div>' +

      (!liberada && naAberta
        ? '<div class="ok-caixa"><b>Regra da competência:</b> a depreciação só vira lançamento no último dia do período, em ' +
          esc(st.dataLancamento || '') + '. Até lá os veículos ficam como <b>AGUARDANDO</b> e não contam como pendência.</div>'
        : '') +

      '<div class="dash-kpis">' +
        '<div class="dash-kpi"><div class="label">Bens na competência</div><div class="numero">' + num(bens.length) + '</div>' +
          '<div class="nota">' + brl(d.totalBens) + '</div></div>' +
        '<div class="dash-kpi"><div class="label">Valor previsto</div><div class="numero">' + brl(st.valorPrevisto) + '</div></div>' +
        '<div class="dash-kpi"><div class="label">Valor lançado</div><div class="numero">' + brl(st.valorLancado) + '</div></div>' +
        '<div class="dash-kpi"><div class="label">Concluídos</div><div class="numero">' + num(st.concluidos) + ' / ' + num(st.previstos) + '</div></div>' +
      '</div>' +

      (Number(st.deOrigemReserva || 0) > 0
        ? '<div class="aviso"><b>' + num(st.deOrigemReserva) + ' veículo(s)</b> estão sendo depreciados pelo valor do ' +
          '<b>cadastro</b>, e não pelo arquivo da competência — eles não vieram na importação deste mês. ' +
          num(st.deOrigemArquivo) + ' vieram do arquivo.</div>'
        : '') +
      (Number(st.semValor || 0) > 0
        ? '<div class="aviso">' + num(st.semValor) + ' veículo(s) ativo(s) sem valor nenhum: nem no arquivo, nem no cadastro. Não são lançados.</div>'
        : '') +

      depPainelVinculo(d.vinculo) +

      '<div class="cartao"><b>Importar o arquivo de bens</b>' +
        '<p class="sub" style="margin:6px 0 10px">Abra a planilha do contábil, selecione as duas colunas ' +
          '(<b>Bem</b> e <b>Valor</b>) e cole aqui. O cabeçalho e a linha <b>Total Geral</b> são descartados sozinhos. ' +
          'Nada é gravado antes de você conferir o total.</p>' +
        '<textarea id="depColagem" rows="6" placeholder="10000017&#9;4310,09&#10;10001099&#9;208,34" ' +
          'style="width:100%;font-family:monospace;font-size:13px"></textarea>' +
        '<div style="margin-top:10px">' +
          '<button class="acao secundaria" onclick="depAnalisar()">🔍 Conferir antes de gravar</button></div>' +
        '<div id="depPrevia" style="margin-top:12px"></div></div>' +

      '<div class="cartao"><b>Lançar um bem na mão</b>' +
        '<p class="sub" style="margin:6px 0 10px">Para o bem que não veio no arquivo, ou para corrigir um valor importado.</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' +
          '<div><label for="depBem">Bem / patrimônio</label>' +
            '<input type="text" id="depBem" style="max-width:180px" placeholder="10042709"></div>' +
          '<div><label for="depValor">Valor R$</label>' +
            '<input type="text" id="depValor" style="max-width:150px" placeholder="1.234,56"></div>' +
          '<button class="acao secundaria" onclick="depSalvarBem()">Gravar bem</button></div></div>' +

      '<div class="cartao" style="padding:0;overflow:hidden">' +
        '<div style="padding:14px 16px 0"><b>Bens de ' + esc(DEP_COMPETENCIA) + '</b> ' +
          '<span class="sub2">' + num(bens.length) + ' bem(ns) • ' + brl(d.totalBens) + '</span></div>' +
        '<div class="rolagem"><table><thead><tr><th>Bem</th><th>Placa</th><th>Centro</th>' +
          '<th class="num">Valor</th><th>Origem</th><th></th></tr></thead><tbody>' +
          (linhasBens || '<tr><td colspan="6" class="sub2" style="padding:14px">Nenhum bem gravado nesta competência. Importe o arquivo ou lance na mão.</td></tr>') +
          '</tbody></table></div></div>' +

      '<div class="cartao"><b>Divergências entre o lançado e a competência</b>' +
        '<p class="sub" style="margin:6px 0 10px">Compara o que já virou lançamento com o valor ' +
          'desta competência. Acertar reescreve o lançamento com trilha em <b>Lançamentos Excluídos</b>.</p>' +
        '<button class="acao secundaria" onclick="depDivergencias()">🔄 Reconferir</button>' +
        '<div id="depDiverg" style="margin-top:12px"></div></div>' +

      '<div class="cartao" style="padding:0;overflow:hidden">' +
        '<div style="padding:14px 16px 0"><b>Situação por veículo</b> ' +
          '<span class="sub2">o que já virou lançamento na competência aberta</span></div>' +
        '<div class="rolagem"><table><thead><tr><th>Veículo</th><th>Centro</th>' +
          '<th class="num">Previsto</th><th class="num">Lançado</th><th>Situação</th></tr></thead><tbody>' +
          linhasVeic + '</tbody></table></div></div>';

    if (DEP_DIVERG) renderDivergencias(DEP_DIVERG);
  }

  /**
   * Acerta todas as ajustáveis de uma vez, a partir do cabeçalho.
   *
   * "De uma vez" não é "no escuro": a confirmação traz quantas são, a soma da
   * diferença e quantas são só de centavos. Quem quiser escolher uma a uma
   * continua tendo a lista logo abaixo.
   */
  function depAjustarTodas(botao) {
    var d = DEP_DIVERG;
    if (!d || !d.ajustaveis) { status('Nenhuma divergência ajustável.'); return; }
    var texto = 'Acertar ' + d.ajustaveis + ' lançamento(s) pelo valor da competência ' +
      d.mes + '?' +
      '\n\nDiferença somada: ' + brl(d.somaAjustavel) +
      (d.deCentavos ? '\n' + d.deCentavos + ' é/são só de centavos.' : '') +
      (d.bloqueadas ? '\n' + d.bloqueadas + ' NÃO entra(m): precisa(m) de decisão sua.' : '') +
      '\n\nCada lançamento atual vai para Lançamentos Excluídos e outro é gravado no lugar.';
    if (!confirm(texto)) return;
    botao.disabled = true;
    botao.textContent = 'Acertando…';
    google.script.run.withSuccessHandler(aplicouAjuste).withFailureHandler(function (e) {
      botao.disabled = false;
      botao.textContent = '⚖️ Acertar divergências';
      falha(e);
    }).webDepreciacaoAjustarDivergencias(TOKEN, []);
  }

  function aplicouAjuste(r) {
    status(r.mensagem || '');
    INICIO_CLIENTE = null;
    // Sempre volta a uma tela utilizável. Na recusa o servidor não manda
    // `dados`, e sem isto o botão ficaria preso em "Acertando…" para sempre.
    if (r.dados) renderDepreciacao(r.dados);
    else { telaDepreciacao(DEP_COMPETENCIA); return; }
    if ((r.falhados || []).length) {
      el('depDiverg').innerHTML += '<div class="erro-caixa"><b>Não deu certo em:</b><ul style="margin:6px 0 0 18px">' +
        r.falhados.map(function (f) { return '<li>' + esc(f.placa) + ' — ' + esc(f.motivo) + '</li>'; }).join('') +
        '</ul></div>';
    }
  }

  function depMarcarTodas(marcar) {
    [].slice.call(document.querySelectorAll('.dvChk')).forEach(function (c) { c.checked = marcar; });
  }

  function depDivergencias() {
    el('depDiverg').innerHTML = '<div class="carregando">comparando…</div>';
    google.script.run.withSuccessHandler(function (d) {
      DEP_DIVERG = d;
      renderDivergencias(d);
    }).withFailureHandler(function (e) {
      el('depDiverg').innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';

  function telaSaude(forcar) {
    carregando('executando diagnóstico rápido…');
    google.script.run.withSuccessHandler(function(d){ renderSaude(d); carregarBackupsSaude(); })
      .withFailureHandler(falha).webSaudeSistema(TOKEN, forcar === true);

  function criarBackupAgora(botao) {
    if (botao) { botao.disabled=true; botao.textContent='Criando backup…'; }
    google.script.run.withSuccessHandler(function(r) {
      status('Backup criado: ' + (r.backup ? r.backup.nome : 'concluído'));
      telaSaude();
    }).withFailureHandler(function(e) {
      if (botao) { botao.disabled=false; botao.textContent='💾 Criar backup agora'; }
      status(e.message, true);
    }).webCriarBackupSistema(TOKEN);
  }

  function ativarBackupAutomatico(botao) {
    if (botao) botao.disabled=true;
    google.script.run.withSuccessHandler(function(r) {
      status(r.mensagem || 'Automações verificadas.');
      telaSaude();
    }).withFailureHandler(function(e) {
      if (botao) botao.disabled=false;
      status(e.message, true);
    }).webAtivarBackupAutomatico(TOKEN);
  }

  function repararSistema(botao) {
    if (!confirm('O sistema criará um backup antes do reparo e reconstruirá fórmulas, relatórios, validações e proteções. Continuar?')) return;
    if (botao) { botao.disabled=true; botao.textContent='Reparando…'; }
    el('msgSaude').innerHTML='<div class="carregando">criando backup e reparando a estrutura…</div>';
    google.script.run.withSuccessHandler(function(r) {
      if (!r.ok) {
        el('msgSaude').innerHTML='<div class="erro-caixa">'+esc(r.mensagem)+'</div>';
        if (botao) { botao.disabled=false; botao.textContent='🛠️ Reparar automaticamente'; }
        return;
      }
      status(r.mensagem || 'Reparo concluído.');
      renderSaude(r.saude);
    }).withFailureHandler(function(e) {
      if (botao) { botao.disabled=false; botao.textContent='🛠️ Reparar automaticamente'; }
      el('msgSaude').innerHTML='<div class="erro-caixa">'+esc(e.message)+'</div>';
    }).webRepararSistema(TOKEN);
  }

  function restaurarBackup(botao) {
    var id = botao.getAttribute('data-id');
    var nome = botao.getAttribute('data-nome') || 'backup';
    var confirma = prompt('ATENÇÃO: esta ação substituirá a base operacional atual pelos dados de:\\n\\n' +
      nome + '\\n\\nAntes disso o sistema criará um backup de emergência.\\n\\nDigite RESTAURAR para continuar:');
    if (String(confirma || '').trim().toUpperCase() !== 'RESTAURAR') {
      status('Restauração cancelada.');
      return;
    }
    botao.disabled=true; botao.textContent='Restaurando…';
    google.script.run.withSuccessHandler(function(r) {
      if (!r.ok) {
        status(r.mensagem || 'Não foi possível restaurar.', true);
        botao.disabled=false; botao.textContent='Restaurar dados';
        return;
      }
      INICIO_CLIENTE = null;
      status(r.mensagem || 'Backup restaurado.');
      renderSaude(r.saude);
    }).withFailureHandler(function(e) {
      botao.disabled=false; botao.textContent='Restaurar dados';
      status(e.message, true);
    }).webRestaurarBackup(TOKEN, id, confirma);
  }

  function respostaPeriodo(r) {
    el('msgPeriodo').innerHTML = '<div class="' + (r.ok ? 'ok-caixa' : 'erro-caixa') + '">' + esc(r.mensagem) + '</div>';
    if (el('btnPeriodo')) el('btnPeriodo').disabled = false;
    if (r.ok) { status(r.mensagem); setTimeout(function () { location.reload(); }, 3000); }

  function salvarPeriodoLivre() {
    var ini = el('perInicio').value, fim = el('perFim').value;
    if (!ini || !fim) { el('msgPeriodo').innerHTML = '<div class="erro-caixa">Informe as duas datas.</div>'; return; }
    el('btnPeriodo').disabled = true;
    el('msgPeriodo').innerHTML = '<div class="aviso">Alterando o período e recalculando os relatórios…</div>';
    google.script.run.withSuccessHandler(respostaPeriodo).withFailureHandler(function (e) {
      respostaPeriodo({ ok: false, mensagem: e.message });
    }).webDefinirPeriodoLivre(TOKEN, ini, fim);

  function voltarPeriodoPadrao() {
    el('msgPeriodo').innerHTML = '<div class="aviso">Voltando ao período padrão…</div>';
    google.script.run.withSuccessHandler(respostaPeriodo).withFailureHandler(function (e) {
      respostaPeriodo({ ok: false, mensagem: e.message });
    }).webVoltarPeriodoPadrao(TOKEN);

  function zerarSistema(botao) {
    var escopo = el('zerarEscopo').value;
    var confirmacao = el('zerarConfirma').value;
    var caixa = el('zerarMsg');
    if (String(confirmacao).trim().toUpperCase() !== 'APAGAR TUDO') {
      caixa.innerHTML = '<div class="erro-caixa">Digite exatamente APAGAR TUDO no campo acima para confirmar.</div>';
      return;
    }
    // Sem confirm() do navegador: em alguns ambientes o Google bloqueia a janela e a
    // ação era cancelada em silêncio. A confirmação é o texto digitado.
    botao.disabled = true;
    caixa.innerHTML = '<div class="aviso">Criando o backup e apagando… isso pode levar até 2 minutos. Não feche a página.</div>';
    google.script.run.withSuccessHandler(function (r) {
      botao.disabled = false;
      caixa.innerHTML = '<div class="' + (r.ok ? 'ok-caixa' : 'erro-caixa') + '">' + esc(r.mensagem) + '</div>';
      status(r.ok ? 'Sistema zerado.' : 'Zerar não concluído — veja a mensagem.', !r.ok);
      if (r.ok) setTimeout(function () { location.reload(); }, 8000);
    }).withFailureHandler(function (e) {
      botao.disabled = false;
      caixa.innerHTML = '<div class="erro-caixa">' + esc(e.message) + '</div>';
    }).webZerarSistema(TOKEN, escopo, confirmacao, !!(el('zerarLog') && el('zerarLog').checked));
  }

  function salvarParametro(nome, campo) {
    google.script.run
      .withSuccessHandler(function (r) {
        status(r.mensagem, !r.ok);
        // Mudou o período: o formulário de lançamento precisa das novas datas-limite.
        if (r.ok && r.recarregar) setTimeout(function () { location.reload(); }, 2500);
      })
      .withFailureHandler(function (erro) { status(erro.message, true); })
      .webSalvarParametro(TOKEN, nome, el(campo).value);
  }

      .webEnviarEmail(TOKEN, destino, el('expAba').value);
  }

  function novoUsuario() {
    window.USUARIO_EMAIL_ORIGINAL = '';
    ['uEmail','uNome','uObs','uSenhaTemp'].forEach(function(id){ if(el(id)) el(id).value=''; });
    if(el('uEmail')) { el('uEmail').readOnly=false; el('uEmail').focus(); }
    if(el('uPerfil')) el('uPerfil').value='CONSULTA';
    if(el('uAtivo')) el('uAtivo').value='SIM';
    if(el('uMsg')) el('uMsg').innerHTML='';
  }

  function editarUsuario(email) {
    var u=(window.USUARIOS_CACHE||[]).filter(function(x){return String(x.email).toLowerCase()===String(email).toLowerCase();})[0];
    if(!u)return;
    window.USUARIO_EMAIL_ORIGINAL = String(u.email || '').toLowerCase();
    el('uEmail').value=u.email; el('uEmail').readOnly=true;
    el('uNome').value=u.nome; el('uPerfil').value=u.perfil;
    el('uAtivo').value=String(u.ativo).toUpperCase()==='NAO'?'NAO':'SIM'; el('uObs').value=u.observacao||'';
    if(el('uSenhaTemp')) el('uSenhaTemp').value='';
    el('uMsg').innerHTML='<div class="aviso">Editando <b>'+esc(u.email)+'</b>. Para trocar o e-mail, crie um novo usuário e desative este cadastro.</div>';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function salvarUsuario(redefinir) {
    var senhaTemp = el('uSenhaTemp') ? el('uSenhaTemp').value : '';
    var ehNovo = !(window.USUARIO_EMAIL_ORIGINAL || '');
    if ((ehNovo || redefinir === true) && senhaTemp && senhaTemp.length < 10) {
      el('uMsg').innerHTML='<div class="erro-caixa">A senha temporária precisa ter pelo menos 10 caracteres.</div>';
      return;
    }
    var dados={ email:el('uEmail').value, emailOriginal:window.USUARIO_EMAIL_ORIGINAL||'', nome:el('uNome').value, perfil:el('uPerfil').value,
      ativo:el('uAtivo').value==='SIM', observacao:el('uObs').value, redefinirSenha:redefinir===true,
      senhaTemporaria:(ehNovo || redefinir===true) ? senhaTemp : '' };
    google.script.run.withSuccessHandler(function(r){
      var extra='';
      if(r.senhaTemporaria) extra='<br><b>Senha temporária gerada:</b> ' + esc(r.senhaTemporaria) + '<br>Copie agora e entregue ao usuário.';
      else if(r.ok && r.senhaDefinidaPeloAdmin) extra='<br><b>Senha temporária:</b> definida pelo ADMIN. Entregue ao usuário a senha que você informou.';
      el('uMsg').innerHTML='<div class="'+(r.ok?'ok-caixa':'erro-caixa')+'">'+esc(r.mensagem)+extra+'</div>';
      if(r.ok && el('uSenhaTemp')) el('uSenhaTemp').value='';
      if(r.ok && !redefinir) setTimeout(telaUsuarios,1100);
    }).withFailureHandler(function(e){el('uMsg').innerHTML='<div class="erro-caixa">'+esc(e.message)+'</div>';})
      .webSalvarUsuario(TOKEN, dados);
  }

  function gerarSenhaUsuario() {
    var campo=el('uSenhaTemp');
    if(!campo)return;
    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){ status((r&&r.mensagem)||'Não foi possível gerar a senha.',true); return; }
      campo.value=r.senha||''; campo.type='text'; campo.focus(); campo.select();
      status('Senha temporária gerada. Copie e entregue ao usuário.');
    }).withFailureHandler(function(e){status(e.message,true);}).webGerarSenhaTemporaria(TOKEN);
  }

  function alternarSenhaUsuario() {
    var campo=el('uSenhaTemp'); if(!campo)return;
    campo.type = campo.type === 'password' ? 'text' : 'password';
  }

  function excluirUsuario(email) {
    email=String(email||'').trim().toLowerCase();
    if(!email)return;
    if(!confirm('Excluir o usuário '+email+' do Sistema de Frota?\n\nO acesso ao Web App será revogado e as proteções serão sincronizadas.'))return;
    var confirma=prompt('Para confirmar a exclusão, digite exatamente o e-mail do usuário:\n\n'+email);
    if(String(confirma||'').trim().toLowerCase()!==email){ status('Exclusão cancelada: confirmação não confere.',true); return; }
    google.script.run.withSuccessHandler(function(r){
      status(r.mensagem,!r.ok);
      if(r.ok){ window.USUARIO_EMAIL_ORIGINAL=''; setTimeout(telaUsuarios,500); }
    }).withFailureHandler(function(e){status(e.message,true);}).webExcluirUsuario(TOKEN,email,confirma);
  }

  function telaLog() {
    carregando();
    google.script.run.withSuccessHandler(function (dados) {
      el('tela').innerHTML =
        '<h2 class="titulo">Atividade</h2>' +
        '<p class="sub">Quem fez o quê, do mais recente para o mais antigo.</p>' +
        tabela(dados, 'Nenhuma atividade registrada ainda.');
    }).withFailureHandler(falha).webLog(TOKEN, 80);
  }
</script>
</body>
</html>
